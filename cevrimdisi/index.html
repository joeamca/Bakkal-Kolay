const DN = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const DS = ["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
const WEEK = [1,2,3,4,5,6,0];
const supKey = n => (String(n||"").toLocaleLowerCase("tr-TR").replace(/ç/g,"c").replace(/ğ/g,"g").replace(/ı/g,"i").replace(/ö/g,"o").replace(/ş/g,"s").replace(/ü/g,"u").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60)) || "x";
const dayW = () => { const w = S.settings?.dayW; return Array.isArray(w) && w.length===7 ? w : [1,1,1,1,1,1,1]; };
const today0 = () => { const d = new Date(Date.now()); d.setHours(0,0,0,0); return d.getTime(); };
const ymd = t => { const d = new Date(t); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const SPECIAL = {kapali:{w:0,t:"Kapalı"}, sakin:{w:0.6,t:"Sakin"}, yogun:{w:1.3,t:"Yoğun"}, cokyogun:{w:1.6,t:"Çok yoğun"}};
const specials = () => Array.isArray(S.settings?.special) ? S.settings.special : [];
function scheduleN(supName, N, noLead){
  const sr = S.suppliers[supKey(supName)], days = sr?.days;
  if (!Array.isArray(days) || !days.length) return null;
  const t0 = today0(), dow = new Date(t0).getDay();
  const lead = noLead ? 0 : Math.max(0, Math.min(6, Number(sr?.lead)||0));
  // Sipariş araçtan "lead" gün önce veriliyorsa, bugün verilen sipariş en erken lead gün sonraki araçla gelir
  let a = lead; while (!days.includes((dow+a)%7)) a++;
  let b = a; for (let k=0; k<Math.max(1,N||1); k++){ b++; while (!days.includes((dow+b)%7)) b++; }
  const cover = [], dates = []; for (let k=a; k<b; k++){ cover.push((dow+k)%7); dates.push(t0 + k*DAY + 3*3600e3); }
  return {a, b, days, cover, dates, next:(dow+a)%7, follow:(dow+b)%7, N:Math.max(1,N||1), lead, orderIn:a-lead};
}
function schedule(supName){ return scheduleN(supName, 1); }
function truckIn(supName){ const s = scheduleN(supName, 1, true); return s ? s.a : null; }
function nextDates(n){ const t0 = today0(), r = []; for (let k=0;k<n;k++) r.push(t0 + k*DAY + 3*3600e3); return r; }
function span(dates){
  const w = dayW(), m = w.reduce((x,y)=>x+y,0)/7 || 1, sp = specials();
  let tot = 0; const hits = [];
  for (const t of dates){ const key = ymd(t), sd = sp.find(x=>x.d===key);
    if (sd){ tot += SPECIAL[sd.k]?.w ?? 1; hits.push(sd); } else tot += w[new Date(t).getDay()]/m; }
  return {v: tot, hits};
}

/* ---------- Hesap: sayım yapmadan sipariş ---------- */
function invNorm(p){ // standart normal ters dağılım (Acklam yaklaşımı)
  const a=[-39.6968302866538,220.946098424521,-275.928510446969,138.357751867269,-30.6647980661472,2.50662827745924],
        b=[-54.4760987982241,161.585836858041,-155.698979859887,66.8013118877197,-13.2806815528857],
        c=[-0.00778489400243029,-0.322396458041136,-2.40075827716184,-2.54973253934373,4.37466414146497,2.93816398269878],
        d=[0.00778469570904146,0.32246712907004,2.445134137143,3.75440866190742];
  const pl=0.02425; let q,r;
  if (p<pl){ q=Math.sqrt(-2*Math.log(p)); return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  if (p>1-pl){ q=Math.sqrt(-2*Math.log(1-p)); return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  q=p-0.5; r=q*q; return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}
function stats(p, extra){
  const now = Date.now();
  const ev = (extra ? S.events.concat(extra) : S.events).filter(e => e.productId === p.id);
  const start = Math.min(new Date(p.createdAt).getTime() || now, ...ev.map(e=>new Date(e.date).getTime() - (e.type==="bos" ? (e.days||0)*DAY : 0)));
  const days = Math.max(1, (now - start) / DAY);
  let gelen=0, fire=0, iade=0, ariza=0, bos=0, bittiCount=0;
  let lastGelen=0, lastCount=null, lastCountAt=0, prices=[];
  const weeks = Array.from({length:6}, ()=>({in:0, out:0}));
  for (const e of ev){
    const t = new Date(e.date).getTime();
    const wi = Math.floor((now - t) / (7*DAY));
    const W = wi>=0 && wi<6 ? weeks[5-wi] : null;
    if (e.type==="gelen"){ gelen+=e.qty; if (W) W.in+=e.qty; if (t>lastGelen) lastGelen=t; if (e.price>0) prices.push({t,price:e.price}); }
    else if (e.type==="fire"){ fire+=e.qty; if (W) W.out+=e.qty; }
    else if (e.type==="iade") iade+=e.qty;
    else if (e.type==="ariza"){ ariza+=e.qty; if (W) W.out+=e.qty; }
    else if (e.type==="bos"){ bos+=e.days; bittiCount++; }
    else if (e.type==="sayim" && t>lastCountAt){ lastCount=e.qty; lastCountAt=t; }
  }
  let outDays = 0;
  if (p.outSince){ outDays = Math.max(0,(now - new Date(p.outSince).getTime())/DAY); bos += outDays; bittiCount++; }
  // son 8 hafta: talep değişince eski veriler tahmini aşağı/yukarı çekmesin
  const WIN = 56, winDays = Math.min(days, WIN), wStart = now - winDays*DAY;
  let gR=0, fR=0, iR=0, aR=0, bR=outDays;
  for (const e of ev){ const t = new Date(e.date).getTime(); if (t < wStart) continue;
    if (e.type==="gelen") gR+=e.qty; else if (e.type==="fire") fR+=e.qty; else if (e.type==="iade") iR+=e.qty;
    else if (e.type==="ariza") aR+=e.qty; else if (e.type==="bos") bR+=e.days; }
  bR = Math.min(winDays-0.5, bR);
  const openDays = Math.max(1, winDays - bR);
  // Teslimatlar arası tüketim: ilk teslimattan son teslimata kadar gelen (son teslimat hariç) = o aradaki satış + fire.
  // Son gelen mal henüz satılmadığı için sayılmaz; bu, yeni faturanın tahmini şişirmesini önler.
  const dl = []; for (const e of ev){ if (e.type!=="gelen") continue; const t = new Date(e.date).getTime(); if (t < wStart) continue;
    const k = Math.floor((t - wStart)/DAY); const L = dl[dl.length-1]; if (L && L.k===k) L.q += e.qty; else dl.push({k, t, q:e.qty}); }
  dl.sort((x,y)=>x.t-y.t);
  let consumed, dataRate;
  if (dl.length >= 2){
    const t1 = dl[0].t, tn = dl[dl.length-1].t;
    let g = 0; for (let i=0;i<dl.length-1;i++) g += dl[i].q;
    let f2=0, b2=0;
    for (const e of ev){ const t = new Date(e.date).getTime();
      if ((e.type==="fire"||e.type==="ariza"||e.type==="iade") && t>t1 && t<=tn) f2 += e.qty;
      if (e.type==="bos"){ const s0 = t - e.days*DAY; b2 += Math.max(0, Math.min(t,tn) - Math.max(s0,t1))/DAY; } }
    if (p.outSince){ const s0 = new Date(p.outSince).getTime(); b2 += Math.max(0, tn - Math.max(s0,t1))/DAY; }
    consumed = Math.max(0, g - f2);
    dataRate = consumed / Math.max(1, (tn - t1)/DAY - b2);
  } else {
    consumed = Math.max(0, gR - fR - iR - aR);
    dataRate = consumed / openDays;                // tek teslimat: kaba tahmin
  }
  // Stok çapaları: stoğun kesin bilindiği anlar. Bitti anı (0), rafa bakış (sayım), başlangıç stoğu.
  const anchors = [];
  if (p.initialStock!=null && p.initialStock!=="") anchors.push({t:start, q:Number(p.initialStock)});
  for (const e of ev){ const t = new Date(e.date).getTime();
    if (e.type==="sayim") anchors.push({t, q:e.qty});
    else if (e.type==="bos") anchors.push({t: t - e.days*DAY, q:0}); }
  if (p.outSince) anchors.push({t:new Date(p.outSince).getTime(), q:0});
  anchors.sort((x,y)=>x.t-y.t);
  let anchorRate = null, anchorSpan = 0;
  const B = anchors[anchors.length-1];
  if (B){
    const A = anchors.find(x => x.t >= now - 84*DAY && B.t - x.t >= 7*DAY);
    if (A){
      let g=0,f=0,i=0,ar=0,b=0;
      for (const e of ev){ const t = new Date(e.date).getTime();
        if (e.type==="bos"){ const s0 = t - e.days*DAY; const o = Math.max(0, Math.min(t, B.t) - Math.max(s0, A.t)); b += o/DAY; continue; }
        if (t<=A.t || t>=B.t) continue;               // sayımla aynı anda girilen fatura, sayımdan sonra rafa konmuş sayılır
        if (e.type==="gelen") g+=e.qty; else if (e.type==="fire") f+=e.qty; else if (e.type==="iade") i+=e.qty; else if (e.type==="ariza") ar+=e.qty; }
      anchorSpan = (B.t - A.t)/DAY;
      const open = Math.max(1, anchorSpan - b);
      anchorRate = Math.max(0, A.q + g - f - i - ar - B.q) / open;
    }
  }
  const prior = (Number(p.initialWeekly)||0) / 7;
  const w = dl.length >= 2 || anchorRate!=null ? Math.min(1, days / 21) : 0; // tek faturayla bir şey öğrenilmez // ilk 3 hafta bakkalın tahminiyle harmanla
  // çapa varsa (stoğun kesin bilindiği iki an), o aralıktaki gerçek satış kendi siparişimizden etkilenmez: ona güven
  // Stoğun kesin bilindiği iki an varsa yalnız ona güven: faturalara dayalı hesap, biriken stoğu satış sanabilir.
  const anchorFresh = anchorRate!=null && B && (now - B.t) <= 28*DAY;
  const learned = anchorFresh ? anchorRate : dataRate;
  let rate = (1-w)*prior + w*learned;
  const PO = posFor(p, ev, anchors, now);
  if (PO && PO.rate!=null) rate = PO.rate;
  const NN = Math.max(1, Math.min(4, Number(p.everyN)||1));          // kaç teslimatta bir sipariş (stok maliyeti önerisi)
  const sch = scheduleN(p.supplier, NN);
  const R = sch ? sch.cover.length : Math.max(1, Number(p.intervalDays)||7) * NN;
  const spn = span(sch ? sch.dates : nextDates(R));
  const SP = spn.v;                                  // yoğun/özel günlere göre ağırlıklı gün sayısı
  const fireRate = gR>0 ? fR/gR : (gelen>0 ? fire/gelen : 0);
  const highFire = p.perishable && fireRate >= 0.2;
  const buyP = prices.length ? prices[prices.length-1].price : (Number(p.buyPrice)||null), saleP = Number(p.salePrice)||null;
  let nv = null;                                   // bozulabilir + fiyat biliniyorsa: kâr kaybı ile çöpe giden maliyeti dengele
  if (p.perishable && buyP>0 && saleP>0){
    const G = p.core ? 4 : 2;                       // temel ürün: müşteri kaçırmanın bedeli daha yüksek sayılır
    const u = Math.max(0, saleP - buyP), CR = (G*u) / (G*u + buyP);   // kaçan müşteri = 2 x kâr kabulü
    const z = Math.max(-0.5, Math.min(1, invNorm(Math.min(0.99, Math.max(0.01, CR)))));
    nv = {CR, z, f: 1 + 0.25*z};
  }
  const buf = nv ? Math.max(p.core?1.1:0.9, nv.f) : p.perishable ? (fireRate>=0.2 ? 1.0 : fireRate>=0.1 ? 1.1 : 1.25) : (p.core ? 1.4 : 1.25);
  const target = rate * SP * buf;
  // Son kesin bilinen stoktan bugüne tahmini raf: o andan beri gelen − satılan (tahmini) − bozulan
  // Sayım son teslimattan sonra yapıldıysa: sayımdan bugüne satılanı düş, eksiği tamamla
  // Stoğun kesin bilindiği son andan (başlangıç stoğu, rafa bakış, bitti anı) bugüne:
  // + gelen − tahmini satış − fire/iade. Araç gelene kadar satılacak da düşülür.
  let estStock = null, estDel = null, estKind = null;
  const LA = anchors[anchors.length-1];
  if (LA && !p.outSince){
    let s0 = LA.q;
    for (const e of ev){ const t = new Date(e.date).getTime();
      if (e.type==="gelen" && t >= LA.t) s0 += e.qty;
      else if ((e.type==="fire"||e.type==="ariza"||e.type==="iade") && t > LA.t) s0 -= e.qty; }
    let off = 0;
    for (const e of ev){ if (e.type!=="bos") continue; const t = new Date(e.date).getTime(), b0 = t - e.days*DAY; off += Math.max(0, Math.min(t, now) - Math.max(b0, LA.t)); }
    estStock = Math.max(0, s0 - rate * Math.max(0, (now - LA.t - off)/DAY));
    estKind = ev.some(e=>e.type==="sayim" && new Date(e.date).getTime()===LA.t) ? "count" : "est";
    estDel = Math.max(0, estStock - rate * span(nextDates(sch ? sch.a : 0)).v);
  }
  if (PO && PO.exact!=null && !p.outSince){ estStock = Math.max(0, PO.exact); estKind = "pos"; estDel = Math.max(0, estStock - rate * span(nextDates(sch ? sch.a : 0)).v); }
  let q, mode;
  if (p.outSince){ q = Math.ceil(target); mode = "out"; }
  else if (estDel!=null){ q = Math.max(0, Math.ceil((nv ? rate*SP*nv.f : target) - estDel)); mode = estKind; }
  else if (nv){ q = Math.ceil(rate * SP * nv.f); mode = "nv"; }
  else { q = Math.ceil(rate * SP * (highFire ? 0.9 : p.core ? 1.1 : 1)); mode = highFire ? "fire" : "normal"; }
  if (rate === 0) q = 0;
  // Birkaç teslimatta bir alınan üründe: son siparişten beri N teslimat geçmediyse bu sefer alma
  let nextOrderT = null;
  if (NN>1 && sch && lastGelen>0 && !p.outSince){
    const lg0 = new Date(lastGelen); lg0.setHours(0,0,0,0);
    const delT = today0() + sch.a*DAY;
    let cnt = 0; for (let t=lg0.getTime()+DAY; t<=delT+3600e3; t+=DAY) if (sch.days.includes(new Date(t).getDay())) cnt++;
    if (cnt < NN){ let t = delT, c2 = cnt; while (c2 < NN){ t += DAY; if (sch.days.includes(new Date(t).getDay())) c2++; } q = 0; mode = "skip"; nextOrderT = t; }
  }
  const cs = Math.max(1, Number(p.caseSize)||1);
  const cases = cs>1 && q>0 ? Math.floor(q/cs) : 0, caseRem = cs>1 && q>0 ? q - cases*cs : 0;
  const learning = days < 21 || gelen === 0;
  const lastAnchor = anchors.length ? anchors[anchors.length-1].t : start;
  // İlk hafta bir kez say (stoğun gerçekten azaldığını görmek için), sonra 3-4 haftada bir
  const needFirst = anchorRate==null && days >= 7 && (now - lastAnchor) >= 7*DAY;
  const checkShelf = needFirst || (days >= 14 && (now - lastAnchor) > 14*DAY);
  const conf = gelen===0 ? 0 : days < 21 ? 1 : days < 56 ? 2 : 3;
  prices.sort((a,b)=>a.t-b.t);
  let priceUp = 0;
  if (prices.length>=2){ const a=prices[prices.length-2].price, b=prices[prices.length-1].price;
    const fresh = prices[prices.length-1].t > (new Date(p.salePriceAt||0).getTime());
    if (a>0 && fresh) priceUp=(b-a)/a; }
  // para: son 4 hafta
  const win = Math.min(28, days), winStart = now - win*DAY;
  let fireW = 0, bosW = outDays;
  for (const e of ev){ const t = new Date(e.date).getTime(); if (t < winStart) continue;
    if (e.type==="fire" || e.type==="ariza") fireW += e.qty; else if (e.type==="bos") bosW += e.days; }
  bosW = Math.min(win, bosW);
  const buy = prices.length ? prices[prices.length-1].price : (Number(p.buyPrice)||null);
  const sale = Number(p.salePrice)||null;
  const unit = buy!=null && sale!=null ? sale - buy : null;
  const margin = unit!=null && sale ? unit/sale : null;
  const wk = Math.max(1, win/7);
  const money = {buy, sale, unit, margin, win,
    weekProfit: unit!=null ? rate*7*unit : null,
    fireLossW: buy!=null ? fireW*buy/wk : null, fireW,
    lostProfit: unit!=null ? rate*bosW*Math.max(0,unit) : null, bosW,
    orderProfit: unit!=null ? q*unit : null, orderFireLoss: buy!=null && p.perishable ? Math.round(q*fireRate)*buy : null};
  const basis = {out:"Raf boş: yedek pay ekleniyor", count:"Son rafa bakışa göre", fire:"Fire yüksek: öneri %10 azaltıldı", nv:"Kâr ve bozulma riski dengelendi", skip:"Bu teslimatta alınmıyor", est:"Rafta kalan tahminine göre", pos:"Satışlara göre rafta kalan", normal:"Tükeneni yerine koy"}[mode];
  return {weekly:rate*7, daily:rate, q, mode, basis, expFire: p.perishable ? Math.round(q*fireRate) : 0, hasData: gelen>0,
    cases, caseRem, cs, estDel, fireRate, highFire, NN, nextOrderT, learning, checkShelf, outDays, priceUp, conf, weeks,
    days, bos, openDays, consumed, sch, SP, spHits: spn.hits, money, estStock, nv, winDays, anchorRate, anchorSpan, dataRate2: learned, gelen, fire, iade, ariza, w, prior, dataRate, R, buf, target, lastCount,
    lastPrice: prices.length? prices[prices.length-1].price : null};
}

}

function renderToast(){
  const el = document.getElementById("toast"); if (!el) return;
  const u = S.undo;
  if (!u || Date.now() > u.until){ el.hidden = true; el.innerHTML = ""; return; }
  el.hidden = false; el.innerHTML = `<span>${esc(u.text)}</span><button data-act="undo">Geri Al</button>`;
}
function offerUndo(text, run){ S.undo = {text, run, until: Date.now()+9000}; renderToast(); clearTimeout(offerUndo.t); offerUndo.t = setTimeout(()=>{ S.undo=null; renderToast(); }, 9100); }

function movements(p, st){
  const ev = S.events.filter(e=>e.productId===p.id).map(e=>({...e, t:new Date(e.date).getTime()})).sort((a,b)=>a.t-b.t);
  const r = st.daily, start = Math.min(new Date(p.createdAt).getTime() || Date.now(), ...ev.map(e=>e.t));
  const dels = []; // teslimatları gün+fatura bazında grupla
  for (const e of ev) if (e.type==="gelen"){ const k = ymd(e.t)+"|"+(e.invoiceNo||""); const last = dels[dels.length-1];
    if (last && last.k===k) last.q += e.qty; else dels.push({k, t:e.t, q:e.qty, no:e.invoiceNo, price:e.price}); }
  const outs = ev.filter(e=>e.type==="bos").map(e=>({s:e.t-e.days*DAY, e:e.t}));
  if (p.outSince) outs.push({s:new Date(p.outSince).getTime(), e:Date.now()});
  const openIn = (a,b) => { let o = 0; for (const x of outs) o += Math.max(0, Math.min(b,x.e)-Math.max(a,x.s)); return Math.max(0,(b-a-o)/DAY); };
  const sumT = (types,a,b) => ev.filter(e=>types.includes(e.type) && e.t>a && e.t<=b).reduce((x,e)=>x+e.qty,0);
  let stock = p.initialStock!=null && p.initialStock!=="" ? Number(p.initialStock) : null, prevT = start;
  const rows = [];
  const step = (t, add, meta) => {
    const sold = r * openIn(prevT, t), fire = sumT(["fire","ariza"],prevT,t), iade = sumT(["iade"],prevT,t);
    const ranOut = outs.some(x=>x.s>prevT && x.s<=t), cnt = ev.filter(e=>e.type==="sayim" && e.t>prevT && e.t<=t).pop();
    let before = stock==null ? null : Math.max(0, stock - sold - fire - iade);
    if (cnt) before = Math.max(0, cnt.qty - r*openIn(cnt.t, t) - sumT(["fire","ariza","iade"],cnt.t,t));
    if (ranOut && !cnt) before = 0;
    const days = (t-prevT)/DAY, outD = days - openIn(prevT,t);
    rows.push({...meta, t, days, add, sold, fire, iade, outD, before, after: before==null ? null : before + add, exact: !!cnt || ranOut});
    stock = before==null ? (ranOut ? add : null) : before + add; prevT = t;
  };
  for (const d of dels) step(d.t, d.q, {no:d.no, price:d.price});
  step(Date.now(), 0, {now:true});
  return rows;
}

function statusOf(p, st){

function weekChart(st){
  const W = st.weeks, max = Math.max(1, ...W.map(x=>x.in), ...W.map(x=>x.out));
  if (!W.some(x=>x.in||x.out)) return `<p class="small muted chartEmpty">Grafik ilk faturadan sonra dolacak.</p>`;
  const H = 54, bw = 26, gap = 14, x0 = 6;
  const bars = W.map((x,i)=>{
    const X = x0 + i*(bw+gap), hi = Math.round(H*x.in/max), ho = Math.round(H*x.out/max);
    return `<rect class="b-in" x="${X}" y="${12+H-hi}" width="${bw}" height="${Math.max(hi, x.in?2:0)}" rx="3"/>
      ${x.out?`<rect class="b-out" x="${X+bw*0.25}" y="${12+H-ho}" width="${bw*0.5}" height="${Math.max(ho,2)}" rx="2"/>`:""}
      ${x.in?`<text class="b-val" x="${X+bw/2}" y="${8+H-hi}" text-anchor="middle">${x.in}</text>`:""}
      <text class="b-lab" x="${X+bw/2}" y="${H+26}" text-anchor="middle">${i===5?"bu hafta":(5-i)+" hf. önce"}</text>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${x0*2+6*bw+5*gap} ${H+32}" role="img" aria-label="Son 6 haftada gelen mal ve fire">${bars}</svg>
    <div class="legend small muted"><span><i class="sw in"></i>Gelen mal</span><span><i class="sw out"></i>Fire</span></div>`;
}

  return html;
}

const WHY = {tarih:"Tarihi geçti", hasar:"Hasarlı / kırık", ariza:"Arıza / elektrik kesintisi", diger:"Diğer"};
function viewFire(){
  if (!S.products.length) return emptyProducts();
  let html = "";
  if (S.msg) html += `<div class="notice ${S.msg.kind||"ok"}">${esc(S.msg.text)}</div>`;
  html += fireImpactCard();
  html += `<div class="card stack"><p class="small muted">Hafta boyunca bozulan, kırılan, tarihi geçen ürünü atma; fire kutusuna koy. Haftada bir kutuyu say, buraya yaz, sonra at. Boş bıraktıkların sıfır sayılır.</p></div>
  <div class="card"><div class="row between" style="margin-bottom:6px"><h3>Fire kutusu</h3><span class="small muted">adet</span></div>`;
  const list = stockP().sort((a,b)=>(b.perishable-a.perishable)||a.name.localeCompare(b.name,"tr"));
  html += list.map(p=>`<div class="fireRow">
      <span>${esc(p.name)}${p.perishable?` <span class="chip warn">bozulabilir</span>`:""}</span>
      <input id="fire-${p.id}" data-fire="${p.id}" type="text" data-num="1" min="0" inputmode="numeric" placeholder="0" aria-label="${esc(p.name)} fire adedi">
      <div id="fd-${p.id}" class="fireDetail" hidden>
        <label>Neden?<select id="fwhy-${p.id}">${Object.entries(WHY).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label>
        <label>Açıklama (isteğe bağlı)<input id="fnote-${p.id}" maxlength="140" placeholder="Örn. koli ezik geldi, raf arkasında unutuldu"></label>
      </div></div>`).join("");
  html += `</div><button class="primary" data-act="saveFire">Fireyi Kaydet</button>`;
  html += fireHistory();
  return html;
}
function fireHistory(){
  const since = Date.now() - 56*DAY;
  const evs = S.events.filter(e=>(e.type==="fire"||e.type==="ariza") && new Date(e.date).getTime()>=since)
    .sort((a,b)=>b.date.localeCompare(a.date));
  const name = id => (S.products.find(p=>p.id===id)||{}).name || "Silinmiş ürün";
  if (!evs.length) return `<div class="card stack"><h3>Fire geçmişi</h3><p class="small muted">Son 8 haftada kayıtlı fire yok. Kaydettiğin fireler burada tarih, neden ve açıklamasıyla listelenir.</p></div>`;
  const tot = {};
  for (const e of S.events.filter(e=>(e.type==="fire"||e.type==="ariza") && new Date(e.date).getTime()>=Date.now()-28*DAY)){
    const t = tot[e.productId] ||= {q:0, why:{}}; t.q += e.qty; const w = e.reason || (e.type==="ariza"?"ariza":"tarih"); t.why[w]=(t.why[w]||0)+e.qty;
  }
  let html = `<div class="card stack"><h3>Son 4 hafta özeti</h3>`;
  const rows = Object.entries(tot).sort((a,b)=>b[1].q-a[1].q);
  html += rows.length ? rows.map(([id,t])=>{ const top = Object.entries(t.why).sort((a,b)=>b[1]-a[1])[0][0];
      return `<div class="row between small"><span>${esc(name(id))}</span><span><span class="num">${fmt(t.q)}</span> adet · <span class="muted">çoğu ${esc(WHY[top]||top).toLocaleLowerCase("tr-TR")}</span></span></div>`; }).join("")
    : `<p class="small muted">Son 4 haftada fire yok.</p>`;
  html += `</div><div class="card"><h3 style="margin-bottom:6px">Fire geçmişi (son 8 hafta)</h3>`;
  let day = "";
  for (const e of evs){
    const d = new Date(e.date).toLocaleDateString("tr-TR",{day:"numeric",month:"long",weekday:"long"});
    if (d!==day){ html += `<p class="small" style="margin-top:12px;font-weight:600">${esc(d)}</p>`; day = d; }
    const w = e.reason || (e.type==="ariza"?"ariza":"tarih");
    html += `<div class="item"><div class="name">${esc(name(e.productId))}
        <div class="small muted">${esc(WHY[w]||w)}${e.note?` · ${esc(e.note)}`:""}</div></div>
      <div class="row" style="justify-content:flex-end"><span class="num">${fmt(e.qty)}</span>
      <button class="link" data-act="delEv" data-id="${e.id}">${S.confirmEv===e.id?"Emin misin?":"Sil"}</button></div></div>`;
  }
  return html + `</div>`;
}

const TL = (n, d=0) => { const k = Math.pow(10, d), a = Math.round(Math.abs(Number(n)||0)*k)/k; return (n<0 && a>0 ? "−" : "") + fmt(a, d) + " TL"; };   // −0,3 → "0 TL" ("−0 TL" yazılmaz)
function viewProfit(){
  if (!S.products.length) return emptyProducts();
  const all = stockP().map(p=>({p, st:stats(p)}));
  const priced = all.filter(x=>x.st.money.unit!=null), missing = all.filter(x=>x.st.money.unit==null);
  let html = "";
  if (S.msg) html += `<div class="notice ${S.msg.kind||"ok"}">${esc(S.msg.text)}</div>`;
  if (!priced.length){
    return html + `<div class="card empty stack"><div class="big">₺</div><h2>Kârı Görmek İçin Fiyat Lazım</h2>
      <p class="muted">Ürünler'de her ürüne <b>raf satış fiyatını</b> yaz. Alış fiyatı faturadan otomatik gelir; fatura girmediysen onu da elle yazabilirsin.</p>
      <button class="primary" data-act="goto" data-tab="urunler" data-plain="1">Fiyatları Gir</button></div>`;
  }
  const sum = k => priced.reduce((a,x)=>a+(x.st.money[k]||0),0);
  const wp = sum("weekProfit"), fl = all.reduce((a,x)=>a+(x.st.money.fireLossW||0),0), lp = sum("lostProfit"), net = wp - fl;
  html += `<div class="tiles t4">
    <div class="tile"><span class="tn num">${TL(wp)}</span><span>haftalık kâr (tahmini)</span></div>
    <div class="tile ${fl>0?"bad":""}"><span class="tn num">${TL(fl)}</span><span>haftalık fire zararı</span></div>
    <div class="tile ${lp>0?"warn":""}"><span class="tn num">${TL(lp)}</span><span>bitince kaçan kâr (4 hafta)</span></div>
    <div class="tile ${net<0?"bad":"good"}"><span class="tn num">${TL(net)}</span><span>haftalık net</span></div></div>`;
  let tied = 0, tiedKnown = 0; const tiedRows = [];
  for (const {p,st} of all){ const sh = stockNow(p, st), b = st.money.buy; if (sh!=null && b!=null){ tied += sh*b; tiedKnown++; tiedRows.push({p, v:sh*b, sh}); } }
  const mr = Number(S.settings?.monthlyRate)||0;
  const byNet = priced.slice().sort((a,b)=>((b.st.money.weekProfit-(b.st.money.fireLossW||0))-(a.st.money.weekProfit-(a.st.money.fireLossW||0))));
  const topFire = all.filter(x=>x.st.money.fireLossW>0).sort((a,b)=>b.st.money.fireLossW-a.st.money.fireLossW)[0];
  const topLost = priced.filter(x=>x.st.money.lostProfit>0).sort((a,b)=>b.st.money.lostProfit-a.st.money.lostProfit)[0];
  const lines = [];
  if (byNet[0]) lines.push(`En çok kazandıran ürün <b>${esc(byNet[0].p.name)}</b>. Haftada yaklaşık <b>${TL(byNet[0].st.money.weekProfit - (byNet[0].st.money.fireLossW||0))}</b> net bırakıyor.`);
  if (topFire) lines.push(`Fireden en çok para giden ürün <b>${esc(topFire.p.name)}</b>. Haftada <b>${TL(topFire.st.money.fireLossW)}</b> değerinde mal çöpe gidiyor.`);
  if (topLost) lines.push(`<b>${esc(topLost.p.name)}</b> son 4 haftada ${fmt(topLost.st.money.bosW)} gün rafta yoktu; bu yüzden yaklaşık <b>${TL(topLost.st.money.lostProfit)}</b> kâr kaçtı.`);
  const neg = byNet.filter(x=>x.st.money.unit<=0);
  if (neg.length) lines.push(`<b>${neg.map(x=>esc(x.p.name)).join(", ")}</b> alış fiyatına ya da altına satılıyor. Raf fiyatını kontrol et.`);
  html += `<section class="card stack"><h3>Özet</h3>${lines.map(l=>`<p class="say">${l}</p>`).join("")}
    <p class="small muted">Kâr = satılan adet × (raf fiyatı − son alış fiyatı). Fire zararı = bozulan adet × alış fiyatı. Kaçan kâr, ürünün rafta olmadığı günlerde satılabilecek miktardan hesaplanır.</p></section>`;
  const mx = Math.max(1, ...priced.map(x=>Math.max(x.st.money.weekProfit||0, (x.st.money.fireLossW||0)+(x.st.money.lostProfit||0)/4)));
  html += `<section class="card"><div class="row between" style="margin-bottom:4px"><h3>Ürün ürün haftalık durum</h3><span class="small muted">TL</span></div>
    <div class="legend small muted" style="margin-bottom:6px"><span><i class="sw in"></i>Kâr</span><span><i class="sw out"></i>Fire zararı</span><span><i class="sw lost"></i>Kaçan kâr</span></div>`;
  for (const {p, st} of byNet){
    const m = st.money, fw = m.fireLossW||0, lw = (m.lostProfit||0)/(m.win/7||1);
    const pc = x => Math.max(0, Math.min(100, 100*x/mx));
    html += `<div class="prow"><div class="row between"><b>${esc(p.name)}</b><span class="num ${m.weekProfit-fw<0?"neg":""}">${TL(m.weekProfit - fw)}</span></div>
      <div class="pbar"><span class="pb in" style="width:${pc(m.weekProfit)}%"></span></div>
      ${fw||lw ? `<div class="pbar"><span class="pb out" style="width:${pc(fw)}%"></span><span class="pb lost" style="width:${pc(lw)}%"></span></div>`:""}
      <p class="small muted">Alış <span class="num">${TL(m.buy,2)}</span> · satış <span class="num">${TL(m.sale,2)}</span> · adet başı <b class="num">${TL(m.unit,2)}</b> (%${fmt((m.margin||0)*100)}) · haftada ≈ ${fmt(st.weekly,1)} tane</p></div>`;
  }
  html += `</section>`;
  html += `<section class="card stack"><h2>Rafta Bağlı Para</h2>
    ${tiedKnown ? `<p class="say">Raftaki ve depodaki mallara yaklaşık <b class="num">${TL(tied)}</b> bağlı.${mr?` Paranın aylık maliyeti %${fmt(mr,1)} ise bu, ayda yaklaşık <b class="num">${TL(tied*mr/100)}</b> demek.`:""}</p>
      ${tiedRows.sort((a,b)=>b.v-a.v).slice(0,5).map(x=>`<div class="row between small"><span>${esc(x.p.name)} <span class="muted">≈${fmt(x.sh)} tane</span></span><span class="num">${TL(x.v)}</span></div>`).join("")}`
      : `<p class="small muted">Hesaplamak için ürünlerin rafta kaç tane olduğunu bilmem gerekiyor: yeni üründe başlangıç sayısını gir, ya da "Rafa baktım" ile say.</p>`}
    <div class="row" style="align-items:flex-end"><label style="flex:1;min-width:180px">Paranın aylık maliyeti (%): enflasyon ya da kredi faizi<input id="mrate" type="text" data-num="1" min="0" step="0.1" inputmode="decimal" value="${S.settings?.monthlyRate??""}" placeholder="Örn. 3"></label><button data-act="saveRate">Kaydet</button></div>
    <p class="small muted">Yavaş satan üründe fazla mal tutmak bu parayı bağlar. Alış fiyatları hızlı artıyorsa erken alınan mal değer kazanabilir; bu durumda biraz fazla stok mantıklı olabilir.</p></section>`;
  if (missing.length) html += `<section class="card stack"><h3>Fiyatı eksik ürünler</h3>
    ${missing.map(({p,st})=>`<div class="row between"><span>${esc(p.name)} <span class="small muted">${st.money.sale==null?"satış fiyatı yok":"alış fiyatı yok"}</span></span><button data-act="edit" data-id="${p.id}" data-totab="urunler">Fiyat Gir</button></div>`).join("")}</section>`;
  return html;
}

    const sups = [...new Set(S.products.map(x=>x.supplier).filter(Boolean))];
    const units = ["tane","kg","litre","paket","koli"];

    html += `<form id="pform" class="card stack">
      <h2>${p?"Ürünü düzenle":"Yeni ürün"}</h2>

const ic = (n, s=22) => `<svg class="icon" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||""}</svg>`;
const COL = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)"];
function donut(segs, o={}){
  const size=o.size||150, th=o.thick||22, r=(size-th)/2, C=2*Math.PI*r, tot=segs.reduce((a,s)=>a+Math.max(0,s.v||0),0);
  let off=0, arcs="";
  if (tot>0) for (const s of segs){ const v=Math.max(0,s.v||0); if (!v) continue; const len=C*v/tot;
    arcs += `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${th}" style="stroke:${s.c}" stroke-dasharray="${Math.max(0.01,len-(segs.filter(x=>x.v>0).length>1?2:0)).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"/>`; off+=len; }
  const svg = `<svg class="donut" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${esc(o.label||"")}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${th}" style="stroke:var(--line)"/>${arcs}
    ${o.center!=null?`<text x="50%" y="${size/2+(o.sub?-1:7)}" text-anchor="middle" class="dc">${esc(o.center)}</text>`:""}
    ${o.sub?`<text x="50%" y="${size/2+17}" text-anchor="middle" class="ds">${esc(o.sub)}</text>`:""}</svg>`;
  const leg = `<ul class="dleg">${segs.map(s=>`<li${s.act?` data-act="${s.act}" data-f="${s.f||""}" role="button" tabindex="0"`:""}><i style="background:${s.c}"></i><span>${esc(s.l)}</span><b class="num">${o.fmtv?o.fmtv(s.v||0):fmt(s.v||0)}</b></li>`).join("")}</ul>`;
  return `<div class="dwrap">${svg}${leg}</div>`;
}
function vbars(items, o={}){
  const W=320, H=o.h||130, top=18, bot=34, n=Math.max(1,items.length), gap=Math.min(10, 60/n), bw=Math.min(34,(W-gap*(n+1))/n);
  const mx=Math.max(1,...items.map(x=>x.v||0)), x0=(W-(n*bw+(n-1)*gap))/2;
  const bars=items.map((x,i)=>{ const h=Math.round((H-top-bot)*(x.v||0)/mx), X=x0+i*(bw+gap), Y=H-bot-h;
    return `<rect x="${X.toFixed(1)}" y="${Y}" width="${bw.toFixed(1)}" height="${Math.max(h, x.v?2:0)}" rx="4" style="fill:${x.c||o.c||"var(--c1)"}"/>
      ${x.v?`<text x="${(X+bw/2).toFixed(1)}" y="${Y-5}" text-anchor="middle" class="bv">${esc(o.fmtv?o.fmtv(x.v):fmt(x.v))}</text>`:""}
      <text x="${(X+bw/2).toFixed(1)}" y="${H-bot+14}" text-anchor="middle" class="bl">${esc(x.l)}</text>
      ${x.s?`<text x="${(X+bw/2).toFixed(1)}" y="${H-bot+27}" text-anchor="middle" class="bl2">${esc(x.s)}</text>`:""}`; }).join("");
  return `<svg class="vbars" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||"")}"><line x1="0" x2="${W}" y1="${H-bot}" y2="${H-bot}" style="stroke:var(--line)"/>${bars}</svg>`;
}
const hbar = (pct, c="var(--c1)") => `<div class="hb"><span style="width:${Math.max(0,Math.min(100,pct)).toFixed(1)}%;background:${c}"></span></div>`;
function stackBar(parts, max){ return `<div class="hb">${parts.map(p=>`<span style="width:${Math.max(0,100*p.v/Math.max(1e-9,max)).toFixed(1)}%;background:${p.c}"></span>`).join("")}</div>`; }
function lineChart(pts, o={}){ // pts: [{v, l, mark}]
  const W=320, H=o.h||130, l=6, r=6, top=14, bot=22, n=pts.length;
  if (n<2) return "";
  const vals=pts.map(p=>p.v), mn=Math.min(0,...vals, o.ss??0), mx=Math.max(1,...vals, o.ss??0);
  const X=i=>l+(W-l-r)*i/(n-1), Y=v=>top+(H-top-bot)*(1-(v-mn)/(mx-mn||1));
  const line=pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
  const area=`${X(0).toFixed(1)},${Y(Math.max(mn,0)).toFixed(1)} ${line} ${X(n-1).toFixed(1)},${Y(Math.max(mn,0)).toFixed(1)}`;
  const marks=pts.map((p,i)=>p.mark?`<line x1="${X(i).toFixed(1)}" x2="${X(i).toFixed(1)}" y1="${top-4}" y2="${H-bot}" class="lm"/><text x="${X(i).toFixed(1)}" y="${top-5}" text-anchor="${i===0?"start":i===n-1?"end":"middle"}" class="lmt">${esc(p.mark)}</text>`:"").join("");
  const labs=pts.map((p,i)=>p.l?`<text x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="${i===0?"start":i===n-1?"end":"middle"}" class="bl">${esc(p.l)}</text>`:"").join("");
  const ss = o.ss!=null && o.ss>0 ? `<line x1="${l}" x2="${W-r}" y1="${Y(o.ss).toFixed(1)}" y2="${Y(o.ss).toFixed(1)}" class="lss"/>` : "";
  const zero = mn<0 ? `<line x1="${l}" x2="${W-r}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" style="stroke:var(--line)"/>` : "";
  const outs=pts.map((p,i)=>p.out?`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4" style="fill:var(--c3)"/>`:"").join("");
  return `<svg class="lchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||"")}">${zero}${ss}
    <polygon points="${area}" style="fill:${o.c||"var(--c1)"};opacity:.14"/><polyline points="${line}" fill="none" style="stroke:${o.c||"var(--c1)"}" stroke-width="2.4" stroke-linejoin="round"/>${marks}${outs}${labs}</svg>`;
}

/* ---------- Yardımcılar ---------- */
const isMade = p => Array.isArray(p.recipe) && p.recipe.length>0;
const usedIn = id => S.products.filter(x=>isMade(x) && x.recipe.some(r=>r.id===id));
const stockP = () => S.products.filter(p=>!isMade(p));
const MENU_TABS = ["hareket","tedarik","menu","stok","plan","maliyet","kar","fire","urunler","ayarlar","yonetim","rapor"];
function dayWeight(t){ const w=dayW(), m=w.reduce((x,y)=>x+y,0)/7||1, sd=specials().find(x=>x.d===ymd(t)); return sd ? (SPECIAL[sd.k]?.w??1) : w[new Date(t).getDay()]/m; }
function depDaily(){ const d={}; for (const m of S.products) if (isMade(m)) for (const c of m.recipe){ d[c.id]=(d[c.id]||0)+(Number(m.dailyEst)||0)*(Number(c.qty)||0); } return d; }
function gotToday(pid){ const k=ymd(Date.now()); return S.events.some(e=>e.productId===pid && e.type==="gelen" && ymd(new Date(e.date).getTime())===k); }
function curStock(p, st){
  if (p.outSince) return {v:0, known:true};
  if (st.estStock!=null) return {v:st.estStock, known:true};
  const s = stockNow(p, st); return s==null ? {v:null, known:false} : {v:Math.max(0,s), known:true};
}
const unitOf = p => p?.unit || "tane";
function stockStatus(p, st){
  const cur = curStock(p, st), rate = st.daily;
  const sch = st.sch, got = gotToday(p.id);
  const need = sch ? (sch.a===0 ? (got ? Math.max(1, sch.b) : 0.5) : sch.a) : Math.max(1,(Number(p.intervalDays)||7)/2);
  const cyc = sch ? sch.cover.length : (Number(p.intervalDays)||7);
  const base = {cur, need, cover:null};
  if (p.outSince || (cur.known && cur.v<0.5)) return {...base, k:"out", t:"Bitti", c:"var(--c3)", cover:0};
  if (!cur.known) return {...base, k:"unk", t:"Bilinmiyor", c:"var(--c5)"};
  const cover = rate>0 ? cur.v/rate : 99;
  if (cover < need) return {...base, k:"low", t:"Yetmeyebilir", c:"var(--c2)", cover};
  if (!p.perishable && cover > Math.max(21, 3*cyc)) return {...base, k:"over", t:"Fazla", c:"var(--c4)", cover};
  if (p.perishable && Number(p.shelfDays) && cover > Number(p.shelfDays)) return {...base, k:"over", t:"Bozulmadan bitmez", c:"var(--c4)", cover};
  return {...base, k:"ok", t:"Yeterli", c:"var(--c1)", cover};
}

/* ---------- MRP: ihtiyaç planı ---------- */
function mrpPlan(p, H=14){
  const st = stats(p), dep = depDaily()[p.id]||0, rate = st.daily, indep = Math.max(0, rate - dep);
  const t0 = today0(), cs = Math.max(1, Number(p.caseSize)||1), N = Math.max(1, Number(p.everyN)||1);
  const supp = S.suppliers[supKey(p.supplier)], sdays = supp?.days?.length ? supp.days : null, lead = Number(supp?.lead)||0;
  const iv = Math.max(1, Number(p.intervalDays)||7);
  const day = k => t0 + k*DAY + 3*3600e3;
  const isDel = k => sdays ? sdays.includes(new Date(day(k)).getDay()) : (k % iv === 0);
  const daily = []; for (let k=0;k<H;k++){ const w = dayWeight(day(k)), f = k===0 ? 0.5 : 1; daily.push({k, t:day(k), ind:indep*w*f, dep:dep*w*f}); }
  const got = gotToday(p.id), cur = curStock(p, st);
  const dels = []; for (let k=0;k<H;k++) if (isDel(k)) dels.push(k);
  const firstK = dels.length ? dels[0] : H;
  let on = cur.known ? cur.v : daily.slice(0, firstK).reduce((a,d)=>a+d.ind+d.dep,0);
  const ssDays = Math.max(0, st.buf - 1) * (sdays ? 7/sdays.length : iv);
  const SS = rate * ssDays;
  const roundQ = q => q<=0 ? 0 : (cs>1 && !p.perishable ? Math.ceil(q/cs)*cs : Math.ceil(q));
  const periods = []; const proj = [];
  let k = 0, lastOrd = -99, firstOpp = true;
  // teslimata kadar tüketim
  for (; k<firstK; k++){ on -= daily[k].ind + daily[k].dep; proj.push({k, v:on}); }
  for (let i=0;i<dels.length;i++){
    const ks = dels[i], ke = i+1<dels.length ? dels[i+1] : H;
    const gross = daily.slice(ks, ke).reduce((a,d)=>a+d.ind,0), gdep = daily.slice(ks, ke).reduce((a,d)=>a+d.dep,0);
    const onStart = on; let planned = 0, net = 0, received = false, note = "";
    if (i===0 && ks===0 && got){ received = true; note = "geldi"; lastOrd = i; firstOpp = false; }
    else if (firstOpp){
      planned = st.q; net = null; firstOpp = false; if (planned>0) lastOrd = i;
      if (st.mode==="skip") note = "sırası değil";
    } else if (N>1 && i - lastOrd < N){ note = "sırası değil"; }
    else {
      const ahead = dels.slice(i, i+N); const kEnd = i+N<dels.length ? dels[i+N] : H;
      const g2 = daily.slice(ks, kEnd).reduce((a,d)=>a+d.ind+d.dep,0);
      net = Math.max(0, g2 + SS - onStart); planned = roundQ(net); if (planned>0) lastOrd = i;
    }
    on = onStart + planned;
    for (let kk=ks; kk<ke; kk++){ on -= daily[kk].ind + daily[kk].dep; proj.push({k:kk, v:on, r: kk===ks ? planned : 0}); }
    const price = st.money.buy ?? (Number(p.buyPrice)||0);
    periods.push({t:day(ks), k:ks, len:ke-ks, gross, gdep, onStart, net, planned, cases: cs>1 && planned>0 ? Math.round(planned/cs*10)/10 : 0,
      orderT: day(ks) - lead*DAY, received, note, cash: planned*(price||0), onEnd: on});
  }
  const minOn = proj.length ? Math.min(...proj.map(x=>x.v)) : 0;
  const runOut = proj.find(x=>x.v < 0);
  return {p, st, dep, indep, periods, proj, SS, unknown: !cur.known, start: cur.known ? cur.v : null, minOn, runOut, lead, cs};
}

function costModel(p){
  const st = stats(p), r = st.daily, c = st.money.buy ?? (Number(p.buyPrice)||null);
  if (!(c>0) || !(r>0)) return null;
  const hRate = (S.settings?.monthlyRate ?? 3)/100, oc = (S.settings?.orderCost ?? 10);
  const supp = S.suppliers[supKey(p.supplier)], k = supp?.days?.length || 0;
  const L1 = k ? 7/k : Math.max(1, Number(p.intervalDays)||7);
  const curN = Math.max(1, Number(p.everyN)||1), Lc = L1*curN;
  const cs = Math.max(1, Number(p.caseSize)||1), life = Number(p.shelfDays)||null, fObs = st.fireRate||0;
  const opts = [];
  for (let N=1; N<=4; N++){
    const L = L1*N; if (L>35) break;
    if (p.perishable && !life && N>curN) break;              // raf ömrü bilinmeyen bozulabilirde seyrekleştirme önerme
    if (p.perishable && life && L > Math.max(L1, life/2)) break; // bozulabilir mal raf ömrünün yarısından uzun bekletilmez (tazelik)
    let Q = r*L; if (cs>1 && !p.perishable) Q = Math.ceil(Q/cs)*cs;
    const ss = r*L*Math.max(0, st.buf-1), avgInv = Q/2 + ss;
    const hold = avgInv*c*hRate, ord = oc*30/L;
    let f = 0; if (p.perishable){ f = Math.max(fObs*L/Lc, life ? Math.max(0,(L-life)/L) : 0); f = Math.min(0.9, f); }
    const fire = f*r*30*c;
    opts.push({N, L, Q, avgInv, hold, ord, fire, tot: hold+ord+fire});
  }
  if (!opts.length) return null;
  const cur = opts.find(o=>o.N===curN) || opts[0];
  const best = opts.reduce((a,b)=>b.tot < a.tot ? b : a, cur);
  const short = (st.money.lostProfit||0) * 30 / Math.max(7, st.money.win||28);
  const D = r*30, Hm = c*hRate, eoq = Hm>0 && oc>0 ? Math.sqrt(2*D*oc/Hm) : null;
  return {p, st, c, r, opts, cur, best, save: Math.max(0, cur.tot-best.tot), short, eoq, eoqDays: eoq ? eoq/r : null, L1, k, curN};
}

      <label>Bir ürünü sipariş edip rafa dizmenin emeği (TL) ${assumeO?`<span class="pill info">varsayılan 10</span>`:""}<input id="c-ord" type="text" data-num="1" min="0" step="1" inputmode="decimal" value="${S.settings?.orderCost??""}" placeholder="10"></label></div>
    <p class="small muted">Paranın maliyeti: enflasyon ya da kredi faizi. Emek: o ürün için saymak, sipariş vermek, teslim alıp rafa dizmek için harcadığın zamanın değeri.</p>

    <p class="muted">Faturaları girdikçe alış fiyatı ve satış hızı öğrenilir. İstersen Ürünler'den alış fiyatını elle de yazabilirsin.</p></div>` + assum;
  const sum = k => ms.reduce((a,m)=>a+m.cur[k],0);
  const hold = sum("hold"), ord = sum("ord"), fire = sum("fire"), short = ms.reduce((a,m)=>a+m.short,0);
  const total = hold+ord+fire+short;
  const sugg = [];
  for (const m of ms){
    if (m.best.N!==m.cur.N && m.save>=5) sugg.push({tl:m.save, icon:"truck", t:`${m.p.name}: ${everyTxt(m.best.N)} al`,
      d:`Şu an ${everyTxt(m.cur.N)} alıyorsun. ${m.best.N>m.cur.N?"Daha seyrek ama daha çok almak":"Daha sık ama daha az almak"} ayda yaklaşık <b>${TL(m.save)}</b> kazandırır.`, act:`data-act="applyN" data-id="${m.p.id}" data-n="${m.best.N}"`, btn:"Uygula"});
    const sNow = curStock(m.p, m.st);
    if (!m.p.perishable && sNow.known && sNow.v > m.r*Math.max(21, 3*m.L1*m.curN)){
      const extra = sNow.v - m.r*m.L1*m.curN*1.5, tl = extra*m.c*(S.settings?.monthlyRate??3)/100;
      if (extra>0) sugg.push({tl, icon:"box", t:`${m.p.name}: rafta fazla mal var`, d:`Rafta yaklaşık ${fmt(sNow.v)} ${esc(unitOf(m.p))} var, ≈${fmt(sNow.v/m.r)} günlük. Fazlası ${TL(extra*m.c)} bağlıyor. Rafa bakıp sayıyı girersen sipariş kendiliğinden azalır.`, act:`data-act="goto" data-tab="stok" data-plain="1"`, btn:"Stoğa bak"});
    }
    if (m.p.perishable && m.st.fireRate>=0.12) sugg.push({tl:m.cur.fire*0.4, icon:"trash", t:`${m.p.name}: fire yüksek (%${fmt(m.st.fireRate*100)})`,
      d:`Ayda yaklaşık ${TL(m.cur.fire)} değerinde mal bozuluyor.${m.p.shelfDays?"":" Ürüne raf ömrünü yazarsan uygulama daha sık ama az almayı hesaplayabilir."} Bu sefer siparişi biraz azalt ya da ürünü öne koy.`, act:`data-act="edit" data-id="${m.p.id}" data-totab="urunler"`, btn:"Ürünü düzenle"});
    if (m.short>=15 && !m.p.core) sugg.push({tl:m.short*0.6, icon:"alert", t:`${m.p.name}: sık bitiyor`, d:`Son haftalarda bittiği için ayda yaklaşık <b>${TL(m.short)}</b> kâr kaçıyor. "Temel ürün" yaparsan uygulama biraz daha fazla önerir.`, act:`data-act="applyCore" data-id="${m.p.id}"`, btn:"Temel ürün yap"});
  }
  sugg.sort((a,b)=>b.tl-a.tl);
  const saveAll = ms.reduce((a,m)=>a + (m.best.N!==m.cur.N && m.save>=5 ? m.save : 0), 0);
  html += `<section class="card stack hero"><div><h3>Aylık stok maliyetin</h3><div class="big2 num">${TL(total)}</div>
      <p class="small muted">${ms.length} ürün için tahmini; satış kârından ayrı, stok tutmanın bedeli.</p></div>
    <div class="cmp"><div><span class="small">Şu an</span>${hbar(100,"var(--c3)")}<b class="num">${TL(total)}</b></div>
      <div><span class="small">Önerilerle</span>${hbar(total>0?100*(total-saveAll)/total:0,"var(--c1)")}<b class="num">${TL(total-saveAll)}</b></div></div>
    ${saveAll>0?`<p class="notice ok">Sipariş sıklığı önerilerini uygularsan ayda yaklaşık <b>${TL(saveAll)}</b>, yılda <b>${TL(saveAll*12)}</b> tasarruf.</p>`:`<p class="small muted">Sipariş sıklıkların zaten en ucuz düzende görünüyor.</p>`}
  </section>`;
  html += `<section class="card stack"><h2>Maliyet Neden Oluşuyor?</h2>${donut([
      {l:"Rafta bağlı para", v:Math.round(hold), c:"var(--c4)"}, {l:"Sipariş emeği", v:Math.round(ord), c:"var(--c5)"},
      {l:"Bozulan mal (fire)", v:Math.round(fire), c:"var(--c3)"}, {l:"Bitince kaçan kâr", v:Math.round(short), c:"var(--c2)"}],
      {center:fmt(total), sub:"TL / ay", fmtv:v=>TL(v), label:"Stok maliyeti dağılımı"})}</section>`;
  if (sugg.length) html += `<section class="stack"><h3>Maliyeti düşürmek için</h3>${sugg.slice(0,8).map(s=>`<div class="card sugg"><span class="sic">${ic(s.icon,22)}</span>
      <div class="stack" style="gap:6px;min-width:0"><b>${esc(s.t)}</b><p class="small">${s.d}</p><div class="row"><button class="primary" ${s.act}>${s.btn}</button><span class="small muted">≈ ${TL(s.tl)} / ay</span></div></div></div>`).join("")}</section>`;
  const mx = Math.max(1, ...ms.map(m=>m.cur.tot+m.short));
  html += `<section class="card"><div class="row between" style="margin-bottom:6px"><h2>Ürün Ürün</h2><span class="small muted">TL / ay</span></div>
    <div class="legend small muted" style="margin-bottom:8px"><span><i class="sw" style="background:var(--c4)"></i>Bağlı para</span><span><i class="sw" style="background:var(--c5)"></i>Emek</span><span><i class="sw" style="background:var(--c3)"></i>Fire</span><span><i class="sw" style="background:var(--c2)"></i>Kaçan kâr</span></div>
    ${ms.slice().sort((a,b)=>(b.cur.tot+b.short)-(a.cur.tot+a.short)).map(m=>`<div class="prow"><div class="row between"><b>${esc(m.p.name)}</b><span class="num">${TL(m.cur.tot+m.short)}</span></div>
      ${stackBar([{v:m.cur.hold,c:"var(--c4)"},{v:m.cur.ord,c:"var(--c5)"},{v:m.cur.fire,c:"var(--c3)"},{v:m.short,c:"var(--c2)"}], mx)}
      <p class="small muted">Sipariş: ${everyTxt(m.cur.N)}${m.best.N!==m.cur.N&&m.save>=5?` → önerilen <b>${everyTxt(m.best.N)}</b>`:""}${m.eoq?(m.p.perishable && Number(m.p.shelfDays) && m.eoqDays>Number(m.p.shelfDays) ? ` · EOQ raf ömrünü (${fmt(m.p.shelfDays)} gün) aşıyor; sıklığı bozulma belirliyor` : ` · EOQ ≈ ${fmt(m.eoq, m.eoq<10?1:0)} ${esc(unitOf(m.p))} (≈${fmt(m.eoqDays)} günlük)`):""}</p></div>`).join("")}
  </section>`;
  html += assum;
  html += `<details class="card"><summary><b>Nasıl hesaplanıyor?</b></summary><div class="stack small" style="margin-top:8px">
    <p><b>Bağlı para</b> = ortalama stok × alış fiyatı × paranın aylık maliyeti. Ortalama stok ≈ sipariş miktarının yarısı + güvenlik stoğu.</p>
    <p><b>Sipariş emeği</b> = emek (TL) × ayda kaç kez sipariş verildiği.</p>
    <p><b>Fire</b> = bozulma oranı × aylık satış × alış fiyatı. Sipariş seyrekleştikçe bozulma artar; raf ömrü girilmişse ömrünü aşan kısım bozulmuş sayılır.</p>
    <p><b>Kaçan kâr</b> = ürünün rafta olmadığı günlerde satılamayan miktar × adet kârı.</p>
    <p><b>EOQ</b> (ekonomik sipariş miktarı) = √(2 × aylık satış × emek ÷ aylık elde tutma maliyeti). Uygulama bunu araç günlerine uydurur: her teslimatta, 2 ya da 3 teslimatta bir seçeneklerinin toplam maliyetini karşılaştırır.</p></div></details>`;
  return html;
}

/* ---------- Veresiye defteri ---------- */
const isLedger = e => e.type==="borc" || e.type==="odeme";
function custStats(c){
  const ev = S.events.filter(e=>isLedger(e) && e.customerId===c.id).sort((a,b)=>a.date.localeCompare(b.date));
  let bal = 0; const debts = [], series = []; let lastT = 0;
  for (const e of ev){ const a = Number(e.amount)||0, t = new Date(e.date).getTime();
    if (e.type==="borc"){ bal += a; debts.push({t, left:a}); }
    else { bal -= a; let pay = a; for (const d of debts){ if (pay<=0) break; const k = Math.min(d.left, pay); d.left -= k; pay -= k; } }
    lastT = t; series.push({t, bal}); }
  const open = debts.filter(d=>d.left>0.005), oldest = open.length ? open[0].t : null;
  const buckets = [0,0,0,0]; for (const d of open){ const age = (Date.now()-d.t)/DAY; buckets[age<15?0:age<30?1:age<60?2:3] += d.left; }
  return {bal: Math.round(bal*100)/100, ev, oldest, ageDays: oldest ? (Date.now()-oldest)/DAY : 0, buckets, lastT, series};
}
const TLx = n => { const a = Math.round(Math.abs(Number(n)||0)*100)/100; return (n<0 && a>0 ? "−" : "") + a.toLocaleString("tr-TR",{minimumFractionDigits:a%1?2:0,maximumFractionDigits:2}) + " TL"; };
function initials(n){ return String(n||"?").trim().split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toLocaleUpperCase("tr-TR") || "?"; }
function avatar(c, s=44){ let h = 0; for (const ch of String(c.name||"")) h = (h*31 + ch.charCodeAt(0))>>>0; return `<span class="av" style="width:${s}px;height:${s}px;font-size:${Math.round(s*0.38)}px;background:${COL[[0,3,5,1,4][h%5]]}">${esc(initials(c.name))}</span>`; }
const agoTxt = t => { if (!t) return "kayıt yok"; const d = Math.floor((today0() - new Date(new Date(t).setHours(0,0,0,0)).getTime())/DAY); return d<=0 ? "bugün" : d===1 ? "dün" : d+" gün önce"; };
const AGE = [["0–15 gün","var(--c1)"],["15–30 gün","var(--c4)"],["30–60 gün","var(--c2)"],["60+ gün","var(--c3)"]];
function reminderText(c, s){ return `Merhaba ${c.name}, bakkal defterinde ${TLx(s.bal)} borcunuz görünüyor${s.oldest?` (en eskisi ${new Date(s.oldest).toLocaleDateString("tr-TR",{day:"numeric",month:"long"})})`:""}. Uygun olduğunuzda bekleriz. İyi günler.`; }
function viewVeresiye(){
  let html = noticeHtml();
  const custs = Object.values(S.customers||{});
  if (S.vEditCust) return html + custForm(S.vEditCust==="__new" ? null : S.customers[S.vEditCust]);
  if (S.vCust && S.customers[S.vCust]) return html + custDetail(S.customers[S.vCust]);
  if (!custs.length) return html + `<div class="card empty stack"><div class="big">${ic("book",44)}</div><h2>Veresiye Defteri</h2>
    <p class="muted">Veresiye verdiğin müşterileri buraya yaz.</p>
    <div class="choices"><button class="primary" data-act="vNew">${ic("plus",18)} İlk müşteriyi ekle</button></div></div>`;
  const rows = custs.map(c=>({c, s:custStats(c)}));
  const debtors = rows.filter(x=>x.s.bal>0.005), total = debtors.reduce((a,x)=>a+x.s.bal,0);
  const buckets = [0,0,0,0]; for (const x of debtors) x.s.buckets.forEach((v,i)=>buckets[i]+=v);
  const late = debtors.filter(x=>x.s.ageDays>30);
  html += `<div class="balbox ${total>0.005?"debt":"clear"}"><span class="small">Alacağın</span><b class="num">${TL(total)}</b>${debtors.length?`<span class="small">${debtors.length} kişi borçlu${late.length?` · ${late.length} kişinin borcu 30 günü geçti`:""}</span>`:""}</div>`;
  html += `<div class="row search"><label class="sbox">${ic("search",18)}<input id="v-search" type="search" placeholder="Müşteri ara" aria-label="Müşteri ara" autocomplete="off"></label><button class="primary" data-act="vNew">${ic("plus",18)} Yeni müşteri</button></div>`;
  rows.sort((a,b)=>(b.s.bal>0.005)-(a.s.bal>0.005) || b.s.bal-a.s.bal || a.c.name.localeCompare(b.c.name,"tr"));
  html += `<section class="stack" id="clist" style="gap:8px">${rows.map(({c,s})=>{
    const ag = s.bal>0.005 ? (s.ageDays>60?"bad":s.ageDays>30?"warn":"ok") : "info";
    return `<button class="ccard" data-act="vOpen" data-id="${c.id}" data-name="${esc(norm(c.name))}">${avatar(c)}
      <span class="cmid"><b>${esc(c.name)}</b><span class="small muted">${s.bal>0.005&&s.oldest?(Math.floor(s.ageDays)<1?"bugünden beri bekliyor":`${Math.floor(s.ageDays)} gündür bekliyor`):`son işlem ${agoTxt(s.lastT)}`}</span>
      ${c.limit>0 && s.bal>0?hbar(100*s.bal/c.limit, s.bal>c.limit?"var(--c3)":"var(--c4)"):""}</span>
      <span class="cbal ${ag}"><b class="num">${s.bal>0.005?TL(s.bal):s.bal<-0.005?"+"+TL(-s.bal):"0 TL"}</b><small>${s.bal>0.005?"borç":s.bal<-0.005?"fazla ödedi":"borcu yok"}</small></span></button>`; }).join("")}</section>
    <p class="small muted" id="cnone" hidden>Aramaya uyan müşteri yok.</p>`;
  return html;
}

      <input id="v-note" maxlength="80" placeholder="${S.vMode==="borc"?"Ne aldı? (ekmek, süt, sigara…)":"Not (isteğe bağlı)"}" aria-label="Not">

  </section>`;
  if (s.series.length>=2){
    const pts = s.series.slice(-20).map((x,i,a)=>({v:x.bal, l: i===0||i===a.length-1 ? new Date(x.t).toLocaleDateString("tr-TR",{day:"numeric",month:"short"}) : ""}));
    html += `<section class="card stack"><h3>Borç</h3>${lineChart(pts, {c:"var(--c3)", label:"Borç bakiyesi"})}</section>`;

  let run = 0; const hist = s.ev.map(e=>{ run += e.type==="borc" ? Number(e.amount) : -Number(e.amount); return {e, run}; }).reverse();

  const inApp = /FBAN|FBAV|FB_IAB|FBIOS|Instagram|Line\/|; wv\)|WhatsApp|Snapchat|TikTok|musical_ly/i.test(ua);
  const ios = /iPhone|iPad|iPod/i.test(ua);

    <span>Facebook, WhatsApp gibi uygulamaların içinden açınca kayıtlar silinebilir.</span>
    <span>${ios ? "Sağ alttaki <b>⋯</b> ya da paylaş düğmesine bas, <b>Safari'de aç</b>'ı seç." : "Sağ üstteki <b>⋮</b> üç noktaya bas, <b>Chrome'da aç</b> ya da <b>Tarayıcıda aç</b>'ı seç."}</span>
    <button data-act="copyLink">Bağlantıyı Kopyala</button></div>`;

function loadScript(src){ return new Promise((res,rej)=>{ if (window.XLSX) return res(); const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>{ s.remove(); rej(new Error("yok")); }; document.head.appendChild(s); }); }
// Excel kütüphanesi: SheetJS 0.20.3 (resmi dağıtım; 0.18.5'teki bilinen açıklar kapalı). Dosya OKUMA sadece yeni sürümle yapılır;
// yeni sürüm indirilemezse sadece Excel'e YAZMA (indirme) için eski sürüme düşülür.
const XLSX_NEW = "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js", XLSX_OLD = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
const xlsxOld = () => /^0\.18\./.test(String(window.XLSX?.version||""));
async function loadXLSX(read){
  if (window.XLSX && !(read && xlsxOld())) return window.XLSX;
  try{ if (window.XLSX) window.XLSX = undefined; await loadScript(XLSX_NEW); }
  catch(e){ if (read) throw new Error("Excel okuyucu indirilemedi. İnterneti kontrol edip tekrar dene."); await loadScript(XLSX_OLD); }
  return window.XLSX;
}
const TYP = {gelen:"Gelen (fatura)", iade:"İade", fire:"Fire", ariza:"Arıza firesi", bos:"Rafta yoktu", sayim:"Raf sayımı", fireyok:"Fire yok"};
const TYP_R = Object.fromEntries(Object.entries(TYP).map(([k,v])=>[norm(v),k]));
const yesno = v => v ? "Evet" : "";
const isYes = v => ["evet","e","x","1","true","var"].includes(norm(v));
const localStamp = t => { const d = new Date(t); return ymd(t)+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
function parseStamp(v){
  if (v instanceof Date && !isNaN(v)) return v.toISOString();
  if (typeof v==="number"){ const ms = Math.round((v - 25569) * 86400000); const d = new Date(ms + new Date(ms).getTimezoneOffset()*60000); return isNaN(d) ? null : d.toISOString(); }
  const m = String(v||"").trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/) || String(v||"").trim().match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
  if (!m) return null;
  const [y,mo,d] = m[1].length===4 ? [m[1],m[2],m[3]] : [m[3],m[2],m[1]];
  const dt = new Date(Number(y), Number(mo)-1, Number(d), Number(m[4]||12), Number(m[5]||0));
  return isNaN(dt) ? null : dt.toISOString();
}
const numOr = (v, def=null) => { if (v===""||v==null) return def; const n = Number(String(v).replace(",",".")); return isNaN(n) ? def : n; };

      {"Bu dosya":"Fiyat ya da ad düzeltmek istersen Ürünler sayfasında değiştirip geri yükleyebilirsin; kayıt no'ya dokunma."}], "Bilgi", {"Bu dosya":""});

async function saveFile(name, buf, mime){
  try{ const dl = window.claude?.use ? await window.claude.use("downloads") : null;
    if (dl){ const r = await dl.save({filename:name, data:buf}); return r?.status==="saved" ? "saved" : "delivered"; } }
  catch(e){ if (["declined","cancelled","canceled"].includes(e?.code)) return "cancel"; }
  try{ const f = new File([buf], name, {type:mime});
    if (navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:name}); return "shared"; } }
  catch(e){ if (e?.name==="AbortError") return "cancel"; }
  const url = URL.createObjectURL(new Blob([buf], {type:mime}));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
  return "tried";
}

async function readXlsx(file){

  try{

        initialStock:numOr(r["Başlangıç stoğu"]), buyPrice:numOr(r["Alış TL"]), salePrice:numOr(r["Satış TL"]), outSince: out,
        aliases:String(r["Diğer adlar"]||"").split("|").map(x=>x.trim()).filter(Boolean),
        createdAt: parseStamp(r["Eklenme"]) || old?.createdAt || nowIso(),
        unit:String(r["Birim"]||"").trim()||old?.unit||"tane", shelfDays:numOr(r["Raf ömrü (gün)"]), everyN:Math.max(1, numOr(r["Kaç teslimatta bir"],1)),
        _made:isYes(r["Hazırlanan (reçeteli)"]), _rec:String(r["Reçete"]||""), dailyEst:numOr(r["Günlük hazırlama"]),
        ...("Barkodlar" in r ? {barcodes:String(r["Barkodlar"]||"").split("|").map(x=>x.trim()).filter(Boolean).map(x=>{ const [c,q] = x.split(":"); return {c:c.replace(/\D/g,""), q:Number(q)||1}; }).filter(b=>b.c),
          byWeight:isYes(r["Kiloyla satılır"]), quick:isYes(r["Hızlı düğme"]), plu:String(r["Terazi kodu"]||"").trim()||null,
          salePriceAt:(String(r["Satış fiyatı tarihi"]||"").trim() && Date.parse(String(r["Satış fiyatı tarihi"]))) ? String(r["Satış fiyatı tarihi"]).trim() : (old?.salePriceAt||null)} : {})});
      byName[norm(name)] = id;
    }
    for (const x of prods){
      if (x._made){ x.recipe = x._rec.split(";").map(part=>{ const i = part.lastIndexOf("="); if (i<0) return null; const nmx = part.slice(0,i).trim(), q = numOr(part.slice(i+1).trim()); const rid = byName[norm(nmx)]; return rid && q>0 ? {id:rid, qty:q} : null; }).filter(Boolean);
        if (!x.recipe.length) x.recipe = null; }
      else x.recipe = null;

    }
    const have = new Set(S.events.map(e=>e.id)), evs = []; let eSkip = 0, eDup = 0;
    const sig = e => [e.type, e.productId, localStamp(e.date), e.type==="bos" ? e.days : e.qty, e.invoiceNo||""].join("|");
    const seen = new Set(S.events.map(sig));
    for (const r of H){
      if (!String(r["Tarih"]||"").trim() && !String(r["Ürün"]||"").trim() && !String(r["Hareket"]||"").trim()) continue;
      const type = TYP_R[norm(r["Hareket"])]; const date = parseStamp(r["Tarih"]);
      const pid = String(r["Ürün kodu"]||"").trim() || byName[norm(r["Ürün"])] || (type==="fireyok" ? "-" : null);
      if (!type || !date || !pid){ eSkip++; continue; }
      const id = String(r["Kod"]||"").trim() || newId();
      if (have.has(id)){ eDup++; continue; }
      const whyKey = Object.entries(WHY).find(([k,v])=>norm(v)===norm(r["Neden"]))?.[0] || null;
      const e = {id, type, productId:pid, date, qty: type==="bos" ? 0 : numOr(r["Miktar"],0), price:numOr(r["Adet fiyatı TL"]),
        invoiceNo:String(r["Fatura no"]||"").trim()||null, supplier:String(r["Tedarikçi"]||"").trim()||null, reason:whyKey, note:String(r["Not"]||"").trim()||null,
        invKey:String(r["Fatura kodu"]||"").trim()||null};
      if (type==="bos") e.days = numOr(r["Gün"],0);
      if (type==="sayim" && numOr(r["Eski adet"])!=null) e.was = numOr(r["Eski adet"]);
      if ((type==="gelen"||type==="iade"||type==="fire"||type==="ariza"||type==="sayim") && !(e.qty>=0)) { eSkip++; continue; }
      if (seen.has(sig(e))){ eDup++; continue; }
      evs.push(e); have.add(id); seen.add(sig(e));
    }
    const sups = [];
    for (const r of T){ const nm2 = String(r["Tedarikçi"]||"").trim(); if (!nm2) continue;
      const days = String(r["Araç günleri"]||"").split(/[,;\s]+/).map(x=>DS.findIndex(d=>norm(d)===norm(x.slice(0,3)))).filter(i=>i>=0);
      sups.push({...(S.suppliers[supKey(nm2)]||{}), id:supKey(nm2), name:nm2, days, lead:numOr(r["Sipariş kaç gün önce"],0)}); }
    const custs = [], byC = {}; let cNew = 0;
    for (const c of Object.values(S.customers||{})) byC[norm(c.name)] = c.id;
    for (const r of MU){ const name = String(r["Ad"]||"").trim(); if (!name) continue;
      const id = String(r["Kod"]||"").trim() || byC[norm(name)] || newId(); const old = S.customers[id]; if (!old) cNew++;
      custs.push({...(old||{createdAt:(Date.parse(String(r["Eklenme"]||"")) ? String(r["Eklenme"]).trim() : nowIso())}), id, name, phone:String(r["Telefon"]||"").trim(), limit:numOr(r["Borç sınırı TL"]), note:String(r["Not"]||"").trim()}); byC[norm(name)] = id; }
    const lsig = e => [e.type, e.customerId, localStamp(e.date), Number(e.amount)].join("|");
    const lseen = new Set(S.events.filter(isLedger).map(lsig)); let lNew = 0;
    for (const r of VE){ if (!String(r["Tarih"]||"").trim() && !String(r["Müşteri"]||"").trim()) continue; const type = norm(r["İşlem"]).startsWith("öd") ? "odeme" : norm(r["İşlem"]).startsWith("ver") || norm(r["İşlem"]).startsWith("bor") ? "borc" : null;
      const date = parseStamp(r["Tarih"]), cid = String(r["Müşteri kodu"]||"").trim() || byC[norm(r["Müşteri"])], amount = numOr(r["Tutar TL"]);
      if (!type || !date || !cid || !(amount>0)){ eSkip++; continue; }
      const id = String(r["Kod"]||"").trim() || newId(); const e = {id, type, productId:"-", customerId:cid, amount, note:String(r["Not"]||"").trim()||null, date, ...(String(r["Satış kodu"]||"").trim() ? {saleId:String(r["Satış kodu"]).trim()} : {})};
      if (have.has(id) || lseen.has(lsig(e))){ eDup++; continue; }
      evs.push(e); have.add(id); lseen.add(lsig(e)); lNew++; }
    const rawOf = r => { try{ const o = JSON.parse(String(r["Ham (geri yükleme için, değiştirme)"]||"")); return o && typeof o==="object" ? o : null; }catch(_){ return null; } };
    const haveSale = new Set(S.sales.map(x=>x.id)), haveCash = new Set(S.cash.map(x=>x.id)), sales = [], cashes = []; let sSkip = 0;
    for (const r of SL){ const o = rawOf(r); if (!o || !o.id || !Array.isArray(o.it) || !(Number(o.tot) || o.tot===0) || !Date.parse(o.d) || !PAY[o.pay]){ if (String(r["Kod"]||"").trim() || o) sSkip++; continue; } if (haveSale.has(o.id)) continue; sales.push(o); haveSale.add(o.id); }
    for (const r of KS){ const o = rawOf(r); if (!o || !o.id || !CASH_T[o.t] || !(Number(o.a) >= 0) || !Date.parse(o.d)){ if (String(r["Kod"]||"").trim() || o) sSkip++; continue; } if (haveCash.has(o.id)) continue; cashes.push(o); haveCash.add(o.id); }
    let tNew = 0;
    for (const r of TH){ if (!String(r["Tarih"]||"").trim() && !String(r["Tedarikçi"]||"").trim()) continue;
      const kind = norm(r["İşlem"]).startsWith("öd") ? "todeme" : norm(r["İşlem"]).startsWith("alım") || norm(r["İşlem"]).startsWith("alim") ? "tborc" : null;
      const date = parseStamp(r["Tarih"]), nm3 = String(r["Tedarikçi"]||"").trim(), amount = numOr(r["Tutar TL"]);
      if (!kind || !date || !nm3 || !(amount>0)){ eSkip++; continue; }
      const id = String(r["Kod"]||"").trim() || newId();
      if (have.has(id)){ eDup++; continue; }
      const e = {id, type:kind, productId:"-", supplierId:String(r["Tedarikçi kodu"]||"").trim() || supKey(nm3), supName:nm3, amount, note:String(r["Not"]||"").trim()||null, date,
        ...(String(r["Kasa kodu"]||"").trim() ? {cashId:String(r["Kasa kodu"]).trim()} : {}), ...(String(r["Fatura kodu"]||"").trim() ? {invKey:String(r["Fatura kodu"]).trim()} : {})};
      evs.push(e); have.add(id); tNew++; }
    let settings = null;
    if (A.length){
      const w = dayW().slice(), sp = []; let mr = S.settings?.monthlyRate ?? null, oc = S.settings?.orderCost ?? null, shop = S.settings?.shopName ?? null;
      for (const r of A){ const k = String(r["Ayar"]||""), v = String(r["Değer"]??"");
        if (k.startsWith("Gün: ")){ const d = DN.findIndex(x=>x===k.slice(5).trim()); if (d>=0) w[d] = norm(v)==="yoğun"?1.3 : norm(v)==="sakin"?0.8 : 1; }
        else if (k.startsWith("Özel gün: ")){ const d = k.slice(10).trim(), [lv, name] = v.split("|").map(x=>x.trim()); const kk = Object.entries(SPECIAL).find(([a,b])=>norm(b.t)===norm(lv))?.[0];
          if (/^\d{4}-\d{2}-\d{2}$/.test(d) && kk) sp.push({d, k:kk, name:name||SPECIAL[kk].t}); }

        else if (k.startsWith("Dükkân adı")) shop = v.trim() || null; }
      settings = {...S.settings, dayW:w, special:sp, monthlyRate:mr, orderCost:oc, shopName:shop};
    }
    S.imp = {file:file.name, prods, evs, sups, settings, pNew, pUpd, eSkip, eDup, custs, cNew, lNew, sales, cashes, sSkip, tNew};
  }catch(e){ S.imp = {err: e?.message || "Dosya okunamadı. Bu uygulamadan alınmış bir Excel dosyası olduğundan emin ol."}; }
  render();

async function applyImport(){
  const I = S.imp; if (!I || !I.prods) return;
  S.quiet = true;
  try{
    for (const p of I.prods) await store.saveProduct(p);
    for (const x of I.sups) await store.saveSupplier(x);
    for (const c of (I.custs||[])) await store.saveCustomer(c);
    if (I.settings) await store.saveSettings(I.settings);
    for (const e of I.evs) await store.addEvent(e);
    for (const x of (I.sales||[])) await store.saveSale(x);
    for (const x of (I.cashes||[])) await store.saveCash(x);
  } finally { S.quiet = false; }
  S.imp = null; S.msg = {kind:"ok", text:`Excel'den alındı: ${I.prods.length} ürün, ${I.evs.length - (I.lNew||0) - (I.tNew||0)} yeni hareket${I.custs?.length?`, ${I.custs.length} müşteri, ${I.lNew||0} veresiye kaydı`:""}${I.tNew?`, ${I.tNew} tedarikçi hesabı kaydı`:""}${I.sales?.length?`, ${I.sales.length} satış`:""}${I.cashes?.length?`, ${I.cashes.length} kasa kaydı`:""}.`}; render();
}

async function shrink(file){
  const img = await createImageBitmap(file);
  const max = 1800, k = Math.min(1, max/Math.max(img.width,img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return await new Promise(r => c.toBlob(r,"image/jpeg",0.85));
}
async function readInvoice(files){
  S.invBusy = true; S.invMsg = ""; render();
  try{
    const lim = await S.sample.limits().catch(()=>null), maxN = lim?.images?.maxCount || 1;
    const blobs = []; for (const f of files.slice(0, maxN)) blobs.push(await shrink(f));
    const catalog = stockP().map(p=>({id:p.id, ad:p.name, diger_adlar:p.aliases||[], koli_ici:p.caseSize||1}));
    const prompt = `${blobs.length>1?`Bu ${blobs.length} fotoğraf aynı faturanın sayfaları; kalemleri birleştir, tekrar eden satır varsa bir kez say. `:""}Bu fotoğraf Türkiye'de bir bakkalın toptancıdan aldığı mal faturası veya irsaliyesi.
Kalemleri oku ve SADECE şu JSON'u döndür:
{"tedarikci": string|null, "fatura_no": string|null, "tarih": "YYYY-MM-DD"|null,
 "kalemler":[{"ad": faturada yazdığı gibi, "miktar": sayı, "birim": "koli"|"adet"|"paket"|"kg"|"diğer", "koli_ici": sayı|null, "adet_fiyati": adet başına net alış fiyatı TL (iskonto sonrası) | null, "iade": true|false, "eslesen_id": aşağıdaki listeden aynı ürünün id'si | null}]}
Kurallar: bedelsiz/promosyon mal (ör. 10+1) varsa miktara ekle. İade, eksi miktar veya "iade" yazan satırlar için iade=true ve miktar pozitif yaz. Toplam, KDV, ara toplam satırlarını kalem sayma. Emin olmadığın eşleşmede eslesen_id null bırak.
Bakkalın ürün listesi: ${JSON.stringify(catalog)}`;
    const r = await S.sample.json(prompt, {images:blobs, modelTier:"default"});
    const lines = (r?.kalemler||[]).map(k=>{
      const prod = S.products.find(p=>p.id===k.eslesen_id) || S.products.find(p=>norm(p.name)===norm(k.ad) || (p.aliases||[]).some(a=>norm(a)===norm(k.ad)));
      const cs = Number(k.koli_ici) || prod?.caseSize || 1;
      const qty = Math.round((Number(k.miktar)||0) * (k.birim==="koli" ? cs : 1));
      return {raw:k.ad, productId: prod ? prod.id : "__new", newName:k.ad, qty, price: k.adet_fiyati!=null ? Number(k.adet_fiyati) : null, iade:!!k.iade, caseSize: cs};
    });
    if (!lines.length) throw {message:"Faturada kalem bulunamadı. Daha net, düz tutarak tekrar çek ya da elle gir."};
    S.inv = {supplier:r.tedarikci||"", no:r.fatura_no||"", date:(r.tarih||nowIso().slice(0,10)), lines, force:false};
  }catch(e){
    const code = e?.code;
    S.invMsg = code==="rate_limited" ? "Çok sık deneme oldu. Biraz bekleyip tekrar dene."
      : code==="not_granted" ? "Fotoğrafı okumak için izin verilmedi. Satırları elle girebilirsin."
      : (e?.message && !code) ? e.message : "Fatura okunamadı. Işığı iyi bir yerde tekrar çek ya da elle gir.";
  }

const invKeyOf = e => e.invKey || (e.invoiceNo ? "no:"+e.invoiceNo : "d:"+ymd(new Date(e.date).getTime())+"|"+(e.supplier||""));
async function deleteInvoice(key){
  for (const e of S.events.filter(x=>isSupLedger(x) && x.invKey===key)){ if (e.cashId && S.cash.some(c=>c.id===e.cashId)) await store.deleteCash(e.cashId); await store.deleteEvent(e.id); }
  const evs = S.events.filter(e=>(e.type==="gelen"||e.type==="iade"||e.type==="bos") && invKeyOf(e)===key);
  for (const e of evs){
    if (e.type==="bos"){ const p = S.products.find(x=>x.id===e.productId);
      if (p && !p.outSince) await store.saveProduct({...p, outSince: e.outSince || new Date(new Date(e.date).getTime() - e.days*DAY).toISOString()}); }
    await store.deleteEvent(e.id);
  }
  for (const p of S.products.filter(x=>x.createdByInv===key))
    if (!S.events.some(e=>e.productId===p.id)) await store.deleteProduct(p.id);
  S.msg = {kind:"ok", text:"Fatura silindi; stok ve tahminler geri alındı."}; render();
}

async function saveInvoice(){
  syncInv();
  const inv = S.inv;
  // Kaydetmeden önce kontrol: hatalı satır varsa form açık kalır, satır işaretlenir
  if (inv.date && inv.date > ymd(Date.now())){ S.invErr = "Fatura tarihi ileri bir gün olamaz. Bugünü ya da geçmiş bir günü seç."; render(); return; }
  let bad = 0;
  for (const l of inv.lines){ l.err = null;
    if (!l.productId) continue;
    const p0 = S.products.find(x=>x.id===l.productId);
    if (l.productId==="__new" && !(l.newName||l.raw||"").trim()) l.err = "Yeni ürünün adını yaz.";
    else if (l.qty==null || isNaN(l.qty)) l.err = "Miktarı yaz.";
    else if (!(l.qty>0)) l.err = "Miktar 0'dan büyük olmalı.";
    else if (p0 && unitOf(p0)==="tane" && !Number.isInteger(l.qty)) l.err = "Adet küsuratlı olamaz; tam sayı yaz.";
    else if (l.price!=null && (isNaN(l.price) || l.price<0)) l.err = "Fiyat eksi olamaz.";
    if (l.err) bad++; }
  if (bad){ S.invErr = `${bad} satırda eksik ya da hatalı bilgi var. Kırmızı yazılı satırları düzelt; girdiklerin silinmedi.`; render(); return; }
  S.invErr = null;
  // K3: "Yeni ürün" adı zaten varsa (adı ya da faturadaki diğer adı) mevcut ürüne ekle
  const merged = [];
  for (const l of inv.lines){ if (l.productId!=="__new") continue;
    const k = norm(l.newName||l.raw||"");
    const ex = S.products.find(x=>!isMade(x) && (norm(x.name)===k || (x.aliases||[]).some(a=>norm(a)===k)));
    if (ex){ l.productId = ex.id; if (!merged.includes(ex.name)) merged.push(ex.name); } }
  const madeNow = {};
  const before = {};
  for (const l of inv.lines){ const p0 = S.products.find(x=>x.id===l.productId); if (p0 && !before[p0.id]){ const st0 = stats(p0); const rows0 = movements(p0, st0); const nr = rows0[rows0.length-1];
    before[p0.id] = {name:p0.name, days:nr.days, minus: nr.sold+nr.fire+nr.iade, shelf: nr.before, add:0}; } }
  const date = !inv.date || inv.date===ymd(Date.now()) ? nowIso() : new Date(inv.date+"T12:00:00").toISOString();
  const invKey = newId(), created = [];
  let n = 0;
  for (const l of inv.lines){
    if (!l.productId || !(l.qty>0)) continue;
    let p;
    if (l.productId==="__new" && madeNow[norm(l.newName||l.raw||"")]){ p = madeNow[norm(l.newName||l.raw||"")]; }
    else if (l.productId==="__new"){
      const name = (l.newName||l.raw||"").trim(); if (!name) continue;
      p = {id:newId(), name, supplier:inv.supplier, caseSize:l.caseSize||1, intervalDays:7, perishable:false,
           initialWeekly:l.qty, createdAt:nowIso(), aliases: l.raw ? [l.raw] : [], outSince:null, createdByInv:invKey, buyPrice:l.price||null};
      await store.saveProduct(p); created.push(p.id); madeNow[norm(name)] = p;
    } else {
      p = {...S.products.find(x=>x.id===l.productId)};
      let changed = false;
      if (l.raw && !(p.aliases||[]).some(a=>norm(a)===norm(l.raw)) && norm(l.raw)!==norm(p.name)){ p.aliases=[...(p.aliases||[]), l.raw].slice(-8); changed=true; }
      if (!p.supplier && inv.supplier){ p.supplier = inv.supplier; changed = true; }
      if (!l.iade && p.outSince){
        const d = Math.max(0,(new Date(date).getTime()-new Date(p.outSince).getTime())/DAY);
        await store.addEvent({type:"bos", productId:p.id, days:Math.round(d*10)/10, qty:0, date, invKey, outSince:p.outSince});
        p.outSince = null; changed = true;
      }
      if (changed) await store.saveProduct(p);
    }
    await store.addEvent({type: l.iade?"iade":"gelen", productId:p.id, qty:l.qty, price:l.price||null, invoiceNo:inv.no||null, supplier:inv.supplier||null, date, invKey});
    if (!l.iade){ (before[p.id] ||= {name:p.name, days:null, minus:null, shelf:null, add:0}).add += l.qty; }
    n++;
  }
  const supTot = r2(inv.lines.filter(l=>l.productId && l.qty>0 && l.price>0).reduce((a,l)=>a + (l.iade?-1:1)*l.qty*l.price, 0));
  if (n && inv.supplier && Math.abs(supTot) > 0.005){ const sk = await supEnsure(inv.supplier), nt = "Fatura" + (inv.no ? " " + inv.no : "");
    if (supTot > 0){ await supRecord({supId:sk, amount:supTot, kind:"borc", note:nt, invKey, date}); if ((inv.pay||"borc")!=="borc") await supRecord({supId:sk, amount:supTot, kind:"odeme", note:nt + " (peşin)", invKey, fromCash:inv.pay==="kasa", date}); }
    else await supRecord({supId:sk, amount:-supTot, kind:"odeme", note:nt + " (iade)", invKey, date}); }
  S.inv = null;
  S.invSummary = Object.values(before).filter(x=>x.add>0);
  if (created.length) S.newProds = {ids:created, sup:inv.supplier||""};
  if (n) offerUndo(`Fatura kaydedildi (${n} kalem).`, ()=>deleteInvoice(invKey));
  S.msg = {kind:"ok", text: (n ? `Fatura kaydedildi: ${n} kalem.` : "Kaydedilecek kalem yoktu. Ürün seçip miktar girilen satırlar kaydedilir.") + (merged.length ? ` Bu ürünler zaten vardı, yeni kart açılmadı, mevcut ürüne eklendi: ${merged.join(", ")}.` : "")};
  S.tab = n ? "siparis" : "fatura"; render();
}

async function saveFire(){
  const date = nowIso(), added = [], wrong = [];
  for (const p of S.products){ const raw = document.getElementById("fire-"+p.id)?.value; if (raw==null || raw==="") continue;
    const q = Number(String(raw).replace(",",".")); if (isNaN(q) || q<0 || (unitOf(p)==="tane" && !Number.isInteger(q))) wrong.push(p.name); }
  if (wrong.length){ S.msg={kind:"bad",text:`Şu ürünlerde fire adedi hatalı (eksi ya da küsuratlı olamaz): ${wrong.join(", ")}. Düzeltip tekrar kaydet.`}; render(true); window.scrollTo(0,0); return; }
  for (const p of S.products){
    const q = Number(String(document.getElementById("fire-"+p.id)?.value||0).replace(",","."));
    if (!(q>0)) continue;
    const why = document.getElementById("fwhy-"+p.id)?.value || "tarih";
    const note = (document.getElementById("fnote-"+p.id)?.value || "").trim();
    added.push({id:newId(), type: why==="ariza" ? "ariza" : "fire", reason:why, note: note||null, productId:p.id, qty:q, date});
  }
  S.fireImpact = added.map(e=>{
    const p = S.products.find(x=>x.id===e.productId), b = stats(p), a = stats(p, added);
    return {name:p.name, perishable:p.perishable, why:e.reason, qty:e.qty, b, a};
  });
  for (const e of added) await store.addEvent(e);
  if (!added.length) await store.addEvent({type:"fireyok", productId:"-", qty:0, date});
  if (added.length) offerUndo(`Fire kaydedildi (${added.length} ürün).`, async ()=>{ for (const e of added) await store.deleteEvent(e.id); S.fireImpact=null; render(); });
  S.msg = {kind:"ok", text: added.length ? `Fire kaydedildi: ${added.length} ürün. Kutuyu boşaltabilirsin.` : "Bu hafta fire yok olarak kaydedildi."};
  render(); window.scrollTo(0,0);
}

function fireImpactCard(){
  if (!S.fireImpact || !S.fireImpact.length) return "";
  const rows = S.fireImpact.map(x=>{
    const {a,b} = x; let tip = "";
    if (!a.hasData) tip = "Henüz bu ürünün faturası girilmediği için tahmin değişmedi. İlk faturadan sonra fire hesaba katılır.";
    else if (x.why==="ariza") tip = "Arıza tek seferlik sayılır; fire oranını yükseltmez.";
    else if (x.why==="hasar") tip = "Hasar genelde fazla siparişten değil taşımadan veya raftan olur. Sık tekrarlanırsa tedarikçiyle konuş.";
    else if (x.perishable && a.fireRate>=0.15) tip = "Fire yüksek. Daha sık ama daha az sipariş vermeyi dene: Ürünler'den sipariş aralığını kısaltabilirsin.";
    else if (x.perishable) tip = "Fire makul seviyede.";
    return `<div class="item"><div class="name">${esc(x.name)}
        <div class="small muted">Haftalık satış tahmini <span class="num">${fmt(b.weekly,1)} → ${fmt(a.weekly,1)}</span>${a.hasData?` · fire oranı <span class="num">%${fmt(a.fireRate*100)}</span>`:""}</div>
        ${x.perishable && a.expFire>0 ? `<div class="small muted">Bu siparişte yaklaşık <span class="num">${a.expFire}</span> adet bozulması bekleniyor.</div>`:""}
        ${tip?`<div class="small" style="margin-top:4px">${esc(tip)}</div>`:""}</div>
      <div class="qty">${fmt(a.q)}<small>${a.q<b.q?`önce ${fmt(b.q)}`:a.q>b.q?`önce ${fmt(b.q)}`:"değişmedi"}</small></div></div>`;
  }).join("");
  return `<section class="card stack"><div class="row between"><h2>Firenin Etkisi</h2><button class="link" data-act="closeImpact">Kapat</button></div>
    <p class="small muted">Bozulan ürün satılmış sayılmaz. Tahmin buna göre yeniden hesaplandı; sağdaki rakam yeni sipariş önerisi.</p>${rows}</section>`;
}

function orderText(sup){

function memoryStore(){

    async deleteProduct(id){ S.products=S.products.filter(x=>x.id!==id); renderData(); },
    async addEvent(e){ S.events.push({...e,id:e.id||newId()}); renderData(); },
    async deleteEvent(id){ S.events=S.events.filter(x=>x.id!==id); renderData(); },
    async saveSupplier(x){ S.suppliers={...S.suppliers,[x.id]:x}; renderData(); },
    async saveSettings(x){ S.settings=x; renderData(); },
    async saveCustomer(x){ S.customers={...S.customers,[x.id]:x}; renderData(); },
    async deleteCustomer(id){ const c={...S.customers}; delete c[id]; S.customers=c; renderData(); },
    async saveSale(x){ posMemSave("sales", x); }, async saveCash(x){ posMemSave("cash", x); }, async deleteCash(id){ posMemDel("cash", id); }
  };
}

async function flush(){
  clearTimeout(flushTimer);

  const mine = C.queue.filter(q=>q.shop===C.shop.id);
  if (!mine.length){ saving(); return; }
  C.flushing = true; saving();
  const batch = mine.slice(0, 200);
  try{
    const {error} = await SB.from("docs").upsert(batch.map(q=>({shop_id:q.shop, kind:q.kind, id:q.id, data:q.data, deleted:q.deleted})));
    if (error) throw error;

    else { C.err = e; S.msg = {kind:"bad", text:"Kayıt internete gönderilemedi: " + sbMsg(e) + (e.code==="42501" ? " Dükkânın hesabı durdurulmuş ya da bu dükkândan çıkarılmış olabilirsin." : "") + " Kayıtlar telefonda duruyor; bir dakika sonra yeniden denenecek."}; render(); flushTimer = setTimeout(()=>{ C.err = null; flush(); }, 60000); }
