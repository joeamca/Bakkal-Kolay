function applyRow(r){
  if (!r || !C.shop || r.shop_id!==C.shop.id) return;
  if (!C.lastSync || r.updated_at > C.lastSync) C.lastSync = r.updated_at;
  if (C.queue.some(q=>q.shop===r.shop_id && q.kind===r.kind && q.id===r.id)) return; // telefondaki daha yeni
  if (r.updated_by) C.by[r.kind+":"+r.id] = r.updated_by;
  const d = r.deleted ? null : r.data;
  const inArr = (arr) => { const i = arr.findIndex(x=>x.id===r.id); if (!d){ if (i>=0) arr.splice(i,1); } else { const v = {...d, id:r.id}; if (i>=0){ if (arr[i].showCount) v.showCount = true; arr[i] = v; } else arr.push(v); } };
  if (r.kind==="product") inArr(S.products);
  else if (r.kind==="event") inArr(S.events);
  else if (r.kind==="sale"){ inArr(S.sales); salesTouch(); }
  else if (r.kind==="cash") inArr(S.cash);
  else if (r.kind==="supplier" || r.kind==="customer"){ const key = r.kind==="supplier" ? "suppliers" : "customers"; const o = {...S[key]}; if (d) o[r.id] = {...d, id:r.id}; else delete o[r.id]; S[key] = o; }
  else if (r.kind==="settings" && r.id==="staffperm"){ S.perm = d ? {...d} : {}; }
  else if (r.kind==="settings" && d){ S.settings = {...d}; S.settingsFromDb = true; }
}
async function pull(){
  const size = 1000; let n = 0; const since = C.lastSync, cut = new Date(posCutoffT()).toISOString();
  // Satışlar çok olur: telefona sadece son günlerinkini al; eskiler sunucuda toplanır (raporlar, stok)
  for (const part of ["main", "sale"]){
    let from = 0;
    for (;;){
      let q = SB.from("docs").select("shop_id,kind,id,data,deleted,updated_at,updated_by").eq("shop_id", C.shop.id);
      q = part==="main" ? q.neq("kind", "sale") : q.eq("kind", "sale").gte("data->>d", cut);
      if (since) q = q.gte("updated_at", since);
      const {data, error} = await q.order("updated_at", {ascending:true}).order("kind").order("id").range(from, from+size-1);
      if (error) throw error;
      data.forEach(applyRow); n += data.length;
      if (data.length < size) break; from += size;
    }
  }
  prunePos(); C.online = true; cloudSave(); return n;
}

  if (ctx.is_admin && adminView()!=="shop"){ enterAdmin(); return; }               // yönetici: kendi ekranı (bakkal ekranı değil)
  S.admin = false;
  const shops = ctx.shops||[];
  let pick = shops.find(s=>s.id===C.shop?.id) || null;

const ACT_KEY = "bdo-son-hareket", RENEW_KEY = "bdo-pin-yenile", PIN_MAX = 5, PIN_COOL = 5*60000, COLD_LOCK = 60000;
const pinKey = () => C.user ? "bdo-pin-" + C.user.id : null;

async function pinHash(pin, salt){
  const enc = new TextEncoder(), key = await crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:enc.encode(salt), iterations:150000}, key, 256);
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function pinRemember(pin, setAt){ try{ const salt = crypto.getRandomValues(new Uint32Array(4)).join("-"); pinSave({salt, hash: await pinHash(pin, salt), setAt, fails:0, coolUntil:0}); }catch(_){} }

async function savePin(p1, mins){

  if (error) throw error;
  C.ctx = Object.assign(C.ctx||{}, {has_pin:true, pin_set_at:data, pin_mins: mins || pinMins()});
  await pinRemember(p1, data); setRenew(false); markActive(true); cloudSave();
}
async function pinFail(cfg, msgLeft){
  S.pinErr = `PIN yanlış. ${msgLeft} hakkın kaldı.`; render();
}
async function pinTooMany(){
  if (C.queue.length){ S.pinCoolUntil = Date.now() + PIN_COOL; S.pinErr = null; render(); return; }   // kayıt kaybolmasın: çıkış yerine beklet
  setRenew(true); C.loginErr = "5 kez yanlış PIN girildi. Güvenlik için çıkış yapıldı; kullanıcı adın ve şifrenle gir, sonra yeni PIN seç."; await doLogout(true);
}
async function pinAct(a, t){
  if (a==="pinGateSave"){
    const p1 = document.getElementById("pin-1").value, p2 = document.getElementById("pin-2").value, mins = Number(document.getElementById("pin-mins")?.value)||60;
    const bad = pinCheck(p1, p2); if (bad){ C.loginErr = bad; render(); return true; }
    t.disabled = true;
    try{ await savePin(p1, mins); C.loginErr = null; S.msg = {kind:"ok", text:`PIN kaydedildi. Uygulama ${minsLabel(mins)} kullanılmazsa PIN sorulacak.`}; await afterLogin({id:C.user.id}); }
    catch(e){ C.loginErr = sbMsg(e); render(); }
    return true; }
  if (a==="pinSetupOpen"){ S.pinSetup = true; render(true); document.getElementById("pin-1")?.focus(); return true; }
  if (a==="pinSetupCancel"){ S.pinSetup = false; render(); return true; }
  if (a==="pinSetupSave"){
    const p1 = document.getElementById("pin-1").value, p2 = document.getElementById("pin-2").value;
    const bad = pinCheck(p1, p2); if (bad){ S.msg = {kind:"bad", text:bad}; render(true); window.scrollTo(0,0); return true; }
    t.disabled = true;
    try{ await savePin(p1, null); S.pinSetup = false; S.msg = {kind:"ok", text:"PIN değişti. Bütün telefonlarında yeni PIN geçerli."}; }
    catch(e){ S.msg = {kind:"bad", text: isNetErr(e) ? "PIN değiştirmek için internet gerekiyor." : sbMsg(e)}; }
    render(); window.scrollTo(0,0); return true; }
  if (a==="pinLockNow"){ if (pinOn()) lockNow(); return true; }
  if (a==="cirakGec"){ if (!pinOn() || isStaff()) return true;
    await loadPeople(); const L = (C.people||[]).filter(x=>x.role==="staff");
    if (!L.length){ S.msg = {kind:"bad", text:"Çırak moduna geçmek için önce Ayarlar'dan bir çırak hesabı ekle."}; render(true); return true; }
    S.cirakPick = L; S.cirakSel = L[0].user_id; render(true); return true; }
  if (a==="cirakSec"){ S.cirakSel = t.dataset.id; render(true); return true; }
  if (a==="cirakIptal"){ S.cirakPick = null; render(true); return true; }
  if (a==="cirakGecOnay"){
    if (C.queue.length){ S.msg = {kind:"bad", text:`${C.queue.length} kayıt henüz internete gönderilmedi. Önce internete bağlanıp bekle, sonra çırak moduna geç.`}; render(true); return true; }
    if (!SB || C.online===false || navigator.onLine===false){ S.msg = {kind:"bad", text:"Çırak moduna geçmek için internet gerekiyor."}; render(true); return true; }
    const staffId = S.cirakSel, ownerId = C.user.id, shopId = C.shop.id; if (!staffId) return true;
    t.disabled = true; let switched = false;
    try{
      const {data, error} = await SB.functions.invoke("cirak", {body:{action:"gir", shop_id:shopId, staff_id:staffId}});
      if (error || !data?.token_hash) throw new Error(await fnMsg(error, data, "Geçilemedi. İnterneti kontrol edip tekrar dene."));
      pinSave(null); C.leaving = true;                       // sahibin telefondaki PIN kopyası ve önbelleği silinir
      const r = await SB.auth.verifyOtp({token_hash:data.token_hash, type:"magiclink"}); if (r.error) throw r.error;
      switched = true;
      const bg = await SB.functions.invoke("cirak", {body:{action:"bagla", nonce:data.nonce}}); if (bg.error || !bg.data?.ok) throw new Error(await fnMsg(bg.error, bg.data, "Çırak oturumu bağlanamadı."));
      cirakSet({staff:staffId, owner:ownerId, shop:shopId});
      C.user = null; try{ localStorage.removeItem(BKEY); }catch(_){}
      location.reload();
    }catch(e){
      C.leaving = false;
      if (switched){ C.loginErr = "Çırak moduna geçiş tamamlanamadı. Şifrenle tekrar gir."; await doLogout(true); return true; }
      S.msg = {kind:"bad", text: (e && e.message) || "Geçilemedi."}; render(true);
    }
    return true; }
  if (a==="cirakExit"){ if (!isStaff()) return true; S.pinExitCirak = true; S.locked = true; S.pinBuf = ""; S.pinErr = null; S.pinForgot = false; render(); return true; }
  if (a==="cirakStay"){ S.pinExitCirak = false; S.locked = false; S.pinBuf = ""; S.pinErr = null; render(); return true; }
  if (a==="pinForgot"){ if (C.queue.length){ S.pinForgot = true; render(); return true; } setRenew(true); C.loginErr = "Kullanıcı adın ve şifrenle gir; sonra yeni PIN seçeceksin."; await doLogout(true); return true; }
  if (a==="pinForgotCancel"){ S.pinForgot = false; render(); return true; }
  if (a==="pinForgotForce"){ setRenew(true); C.loginErr = "Kullanıcı adın ve şifrenle gir; sonra yeni PIN seçeceksin."; await doLogout(true); return true; }
  if (a==="pinKey" && S.pinExitCirak){
    if (Math.max(S.pinCoolUntil||0) > Date.now() || S.pinBusy) return true;
    const k = t.dataset.k; S.pinErr = null;
    if (k==="del"){ S.pinBuf = (S.pinBuf||"").slice(0,-1); render(); return true; }
    if ((S.pinBuf||"").length >= 4) return true;
    S.pinBuf = (S.pinBuf||"") + k; render();
    if (S.pinBuf.length < 4) return true;
    const pin = S.pinBuf; S.pinBuf = ""; S.pinBusy = true; render();
    try{
      const {data, error} = await SB.functions.invoke("cirak", {body:{action:"don", pin, shop_id:C.shop.id}});
      if (error || !data){ const m = await fnMsg(error, data, ""); if (m){ S.pinBusy = false; S.pinErr = m; render(); return true; } throw error || new Error("yanıt yok"); }
      if (data.ok && data.token_hash){
        C.leaving = true; const r = await SB.auth.verifyOtp({token_hash:data.token_hash, type:"magiclink"}); if (r.error) throw r.error;
        cirakSet(null); S.pinExitCirak = false; S.pinBusy = false; C.user = null; try{ localStorage.removeItem(BKEY); }catch(_){}
        markActive(true); location.reload(); return true; }
      S.pinBusy = false;
      if (data.reason==="cool" || data.reason==="max"){ S.pinCoolUntil = Date.now() + (data.wait||300)*1000; S.pinErr = null; }
      else if (data.reason==="wrong") S.pinErr = `PIN yanlış. ${data.left ?? ""} hakkın kaldı.`;
      else S.pinErr = data.error || "Olmadı.";
    }catch(e){ C.leaving = false; S.pinBusy = false; S.pinErr = isNetErr(e) ? "Sahibe dönmek için internet gerekiyor." : "Olmadı, tekrar dene."; }
    render(); return true; }
  if (a==="pinKey"){
    if (!pinOn()){ S.locked = false; render(); return true; }
    const cfg = pinCfg();
    if (Math.max(cfg?.coolUntil||0, S.pinCoolUntil||0) > Date.now() || S.pinBusy) return true;
    const k = t.dataset.k; S.pinErr = null;
    if (k==="del"){ S.pinBuf = (S.pinBuf||"").slice(0,-1); render(); return true; }
    if ((S.pinBuf||"").length >= 4) return true;
    S.pinBuf = (S.pinBuf||"") + k; render();
    if (S.pinBuf.length < 4) return true;
    const pin = S.pinBuf; S.pinBuf = "";
    const unlock = () => { S.locked = false; S.pinCoolUntil = 0; markActive(true); render(); };
    // 1) internet varsa sunucuda doğrula (deneme sayısı da orada tutulur)
    let r = null;
    if (SB && C.online !== false && navigator.onLine !== false){
      S.pinBusy = true; render();
      try{ const res = await SB.rpc("verify_my_pin", {p_pin:pin}); if (res.error) throw res.error; r = res.data; }
      catch(e){ r = null; if (!isNetErr(e)){ S.pinBusy = false; S.pinErr = sbMsg(e); render(); return true; } }
      S.pinBusy = false;
    }
    if (r){
      if (r.ok){ if (r.mins && C.ctx) C.ctx.pin_mins = r.mins; await pinRemember(pin, r.set_at || C.ctx?.pin_set_at); unlock(); return true; }
      if (r.reason==="none"){ S.locked = false; await afterLogin({id:C.user.id}); return true; }  // PIN silinmiş (şifre yenilendi): yeniden belirlenecek
      if (r.reason==="cool"){ S.pinCoolUntil = Date.now() + (r.wait||300)*1000; render(); return true; }
      if (r.reason==="max"){ await pinTooMany(); return true; }
      await pinFail(cfg, r.left); return true;
    }
    // 2) internet yok: telefondaki kopyayla
    if (!cfg){ S.pinErr = "PIN'i kontrol etmek için internet gerekiyor. Bağlanıp tekrar dene."; render(); return true; }
    if ((await pinHash(pin, cfg.salt)) === cfg.hash){ cfg.fails = 0; cfg.coolUntil = 0; pinSave(cfg); unlock(); return true; }
    cfg.fails = (cfg.fails||0) + 1;
    if (cfg.fails >= PIN_MAX){ cfg.fails = 0; pinSave(cfg); await pinTooMany(); return true; }
    pinSave(cfg); await pinFail(cfg, PIN_MAX - cfg.fails); return true;
  }
  return false;
}

}

  if (a==="settings" && S.admin){ S.tab = "y-hesap"; S.msg = null; render(); window.scrollTo(0,0); return true; }
  if (a==="toShop"){ const shops = C.ctx?.shops || []; if (!shops.length) return true; setAdminView("shop"); S.admin = false; S.tab = "ana"; S.msg = null;
    let pick = null; try{ const last = localStorage.getItem("bdo-son-dukkan"); pick = shops.find(s=>s.id===last) || null; }catch(_){}

/* ---------- Satış (kasa): barkodla satış, peşin / kart / veresiye, kasa hareketleri ---------- */
// Satış kaydı (tür "sale"): {id, d, it:[{p,n,q,u,b,w}], tot, pay, c, al, r (iade), x (iptal), ev (veresiye kaydı)}
// Kasa kaydı  (tür "cash"): {id, d, t: acilis|giris|cikis|kapanis, a, r (sebep), n (not), say, birak}
const POS_KEEP_DAYS = 35, POS_RATE_DAYS = 28;
if (!Array.isArray(S.sales)) S.sales = [];
if (!Array.isArray(S.cash)) S.cash = [];
const PAY = {nakit:"Nakit", kart:"Kart", veresiye:"Veresiye"};
const CASH_T = {acilis:"Açılış Parası", giris:"Kasaya Giriş", cikis:"Kasadan Çıkış", kapanis:"Gün Kapanışı"};
const OUT_REASONS = ["Toptancı / plasiyer ödemesi","Ekmekçi","Fatura (elektrik, su, telefon)","Kira","Personel / yevmiye","Çay, yemek","Bankaya yatırıldı","Kendime aldım","Diğer"];
const IN_REASONS = ["Bozuk para / para eklendi","Bankadan çekildi","Borç ödemesi (deftersiz)","Diğer"];
const r2 = n => Math.round((Number(n)||0)*100)/100;
const r3 = n => Math.round((Number(n)||0)*1000)/1000;
const NUM_MAX = 999999999;   // bir sayı kutusuna yazılabilecek en büyük değer (≈ 1 milyar); fazlası saçma girdi sayılır
const pnumAny = v => { let s = String(v ?? "").trim().replace(/\s/g,"").replace(/TL$/i,""); if (s==="") return NaN;
  if (/^[1-9]\d{0,2}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g,"");   // 1.500 / 1.500,50 → binlik ayraç
  const n = Number(s.replace(",", ".")); return isFinite(n) ? n : NaN; };
const pnum = v => { const n = pnumAny(v); return Math.abs(n) > NUM_MAX ? NaN : n; };
const posCutoffT = () => today0() - POS_KEEP_DAYS*DAY;
const posCloud = () => S.mode==="cloud";
const tOf = x => Date.parse(x.d);
const hhmm = t => new Date(t).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
const qtyTxt = (q, w) => w ? fmt(q, 3) + " kg" : fmt(q, 3);
let salesVer = 0; const salesTouch = () => { salesVer++; };

/* --- satış dizini: ürün başına satılan miktar (hızlı toplam için) --- */
let posIdx = null, posIdxSig = "";
function posIndex(){
  const sig = S.sales.length + ":" + salesVer;
  if (posIdx && posIdxSig === sig) return posIdx;
  const m = new Map();
  for (const s of S.sales){ if (s.x) continue; const t = tOf(s);
    for (const it of (s.it||[])){ if (!it.p || it.p==="-") continue; let a = m.get(it.p); if (!a){ a = []; m.set(it.p, a); } a.push([t, Number(it.q)||0]); } }
  for (const a of m.values()){ a.sort((x,y)=>x[0]-y[0]); let acc = 0; for (let i=a.length-1;i>=0;i--){ acc += a[i][1]; a[i][2] = acc; } }
  posIdx = m; posIdxSig = sig; return m;
}
const POS_NEED = new Set();
function posSoldSince(pid, fromT){
  const a = posIndex().get(pid);
  const cut = posCloud() ? posCutoffT() : -Infinity;
  const lo = Math.max(fromT, cut);
  let local = 0;
  if (a && a.length){ let L = 0, H = a.length; while (L < H){ const M = (L+H)>>1; if (a[M][0] < lo) L = M+1; else H = M; } local = L < a.length ? a[L][2] : 0; }
  if (fromT >= cut) return local;
  const key = pid + "|" + new Date(fromT).toISOString();
  const po = S.cloud?.posOld, old = po && po.cut===new Date(cut).toISOString() ? po.v?.[key] : null;
  if (old == null){ POS_NEED.add(key); return local; }
  return local + Number(old);
}
// Satılan + reçetede kullanılan (tost satılınca ekmek ve kaşar da düşer)
function posUse(pid, fromT, depth){
  let q = posSoldSince(pid, fromT);
  if ((depth||0) < 3) for (const m of S.products) if (isMade(m)) for (const r of m.recipe) if (r.id===pid) q += posUse(m.id, fromT, (depth||0)+1) * (Number(r.qty)||0);
  return q;
}
// stats() içinden: satışa geçildiyse rafta kalan kesin, satış hızı gerçek
function posFor(p, ev, anchors, now){
  // Kolay'da her satış kasadan geçer: rafta kalan her zaman "son sayım + gelen − fire − satılan" (tahminle azaltılmaz).
  const kol = !!window.KOLAY, ps = S.settings?.posStart, pst = ps ? Date.parse(ps) : NaN;
  if (!kol && !isFinite(pst)) return null;
  const LA = anchors.length ? anchors[anchors.length-1] : null;
  let exact = null;
  if (LA && (kol || LA.t >= pst - 60000)){
    let s0 = LA.q;
    for (const e of ev){ const t = Date.parse(e.date);
      if (e.type==="gelen" && t >= LA.t) s0 += e.qty;
      else if ((e.type==="fire"||e.type==="ariza"||e.type==="iade") && t > LA.t) s0 -= e.qty; }
    exact = s0 - posUse(p.id, LA.t);
  }
  let rate = null;
  const from = Math.max(pst, now - POS_RATE_DAYS*DAY), spanD = (now - from)/DAY;
  if (isFinite(pst) && spanD >= 7){
    let off = 0;
    for (const e of ev){ if (e.type!=="bos") continue; const t = Date.parse(e.date), b0 = t - (e.days||0)*DAY; off += Math.max(0, Math.min(t, now) - Math.max(b0, from)); }
    if (p.outSince) off += Math.max(0, now - Math.max(Date.parse(p.outSince), from));
    rate = Math.max(0, posUse(p.id, from)) / Math.max(1, spanD - off/DAY);
  }
  return {exact, rate};
}
async function posMarkStart(){
  if (S.settings?.posStart) return;
  await store.saveSettings({...S.settings, posStart: nowIso()});
}

/* --- barkod --- */
const cleanCode = s => String(s||"").replace(/[^\dA-Za-z\-]/g, "");
function findByBarcode(code){
  for (const p of S.products) for (const b of (p.barcodes||[])) if (b.c===code) return {p, q: Number(b.q)||1, koli: (Number(b.q)||1) > 1};
  return null;
}
function scalePrefixes(){ return String(S.settings?.scalePre ?? "27,28,29").split(/[^\d]+/).filter(Boolean); }
function scaleParse(code){
  if (!/^\d{13}$/.test(code) || !scalePrefixes().some(x=>code.startsWith(x))) return null;
  const plu = String(Number(code.slice(2,7))), val = Number(code.slice(7,12));
  const p = S.products.find(x=>x.plu!=null && x.plu!=="" && String(Number(x.plu))===plu);
  if (!p) return {plu, unknown:true};
  if ((S.settings?.scaleMode||"w")==="p"){ const price = val/100, u = Number(p.salePrice)||0; return {p, q: u>0 ? r3(price/u) : 1, u: u>0 ? u : price}; }
  return {p, q: r3(val/1000)};
}
function buyOf(p, depth){
  if (!p) return null;
  if (isMade(p)){ if ((depth||0) > 3) return null; let s = 0; for (const r of p.recipe){ const c = S.products.find(x=>x.id===r.id); const b = buyOf(c, (depth||0)+1); if (b==null) return null; s += b*(Number(r.qty)||0); } return r2(s); }
  let best = null, t0 = 0;
  for (const e of S.events) if (e.productId===p.id && e.type==="gelen" && e.price>0){ const t = Date.parse(e.date); if (t > t0){ t0 = t; best = e.price; } }
  return best ?? (Number(p.buyPrice) > 0 ? Number(p.buyPrice) : null);
}

/* --- sepet --- */
const CART_KEY = "bdo-sepet";
function cartLoad(){ try{ const c = JSON.parse(localStorage.getItem(CART_KEY)||"null"); if (c && Array.isArray(c.items)) return c; }catch(_){} return {items:[], cust:null, ret:false}; }
S.pos = cartLoad();
function cartSave(){ try{ localStorage.setItem(CART_KEY, JSON.stringify({items:S.pos.items, cust:S.pos.cust, ret:S.pos.ret})); }catch(_){} }
function cartTotal(){ return r2(S.pos.items.reduce((a,x)=>a + (Number(x.q)||0)*(Number(x.u)||0), 0)); }
// Ürün sonradan değiştirilirse (kilo↔tane, ad, satış fiyatı) sepetteki satırlar kendiliğinden güncellenir
function cartSync(){
  let ch = [];
  for (const x of S.pos.items){ if (!x.p) continue; const p = S.products.find(y=>y.id===x.p); if (!p) continue;
    const w = !!p.byWeight;
    if (!!x.w !== w){ x.w = w; if (!w && Number(x.q) % 1) x.q = 1; ch.push(p.name); }
    if (x.n !== p.name){ x.n = p.name; }
    const sp = Number(p.salePrice)||0; if (!x.mu && sp > 0 && Number(x.u) !== sp){ x.u = sp; ch.push(p.name); } }
  if (ch.length){ cartSave(); S.posWarn = `Sepet güncellendi: ${[...new Set(ch)].join(", ")} (ürün bilgisi değişti).`; }
}
function cartAdd(p, q, u, opt){
  opt = opt || {};
  const w = !!(p?.byWeight || opt.w), price = u != null ? Number(u) : (Number(p?.salePrice)||0);
  const pid = p ? p.id : null, items = S.pos.items;
  const same = !w && items.find(x=>x.p===pid && !x.w && Number(x.u)===price && (pid || x.n===(opt.n||"Diğer")));
  const manual = u != null && p && Number(u) !== Number(p.salePrice);
  if (same){ same.q = r3(Number(same.q) + q); items.splice(items.indexOf(same), 1); items.unshift(same); S.pos.flash = same.k; }
  else { const k = newId(); items.unshift({k, p:pid, n: p ? p.name : (opt.n||"Diğer"), q: r3(q), u: price, w, ...(manual ? {mu:1} : {})}); S.pos.flash = k; }
  if (p && !(Number(p.salePrice) > 0) && u == null) S.posWarn = `${p.name} için satış fiyatı girilmemiş. Sepette fiyatına dokunup yaz; ürünü düzenleyip de kaydedebilirsin.`;
  if (p) cartClamp(p.id, same ? same.k : items[0]?.k);
  cartSave();
}
// Stokta olandan fazlası satılamaz: sepetteki toplam rafta kalanı geçerse fazlası sepetten düşülür.
// (Tane ürünler; kilo ürünleri ve reçeteli ürünler hariç; iade modunda kontrol yok; hiç sayılmamış ürün serbest.)
function stockLimit(pid){
  const p = S.products.find(x=>x.id===pid);
  if (!p || p.byWeight || p.recipe || S.pos.ret) return null;
  const c = pCur(p); if (c == null) return null;
  return {p, c: Math.max(0, c), inCart: r3(S.pos.items.filter(x=>x.p===pid && !x.w).reduce((a,x)=>a + Number(x.q||0), 0))};
}
function overMsg(L){ return L.c > 0 ? `Rafta sadece ${pQtyTxt(L.c)} ${unitOf(L.p)} ${L.p.name} var; daha fazlası satılamaz.` : `${L.p.name} stokta yok; satılamaz.`; }
function cartClamp(pid, k){
  const L = stockLimit(pid); if (!L || L.inCart <= L.c + 1e-9) return false;
  let fazla = r3(L.inCart - L.c);
  const lines = S.pos.items.filter(x=>x.p===pid && !x.w), first = lines.find(x=>x.k===k);
  for (const x of first ? [first, ...lines.filter(y=>y!==first)] : lines){ if (fazla <= 0) break;
    const d = Math.min(Number(x.q)||0, fazla); x.q = r3(Number(x.q) - d); fazla = r3(fazla - d); }
  S.pos.items = S.pos.items.filter(x=>Number(x.q) > 0);

function voiceApplySale(d, pl){
  const added = [], miss = [], warn = []; S.posWarn = null; S.posErr = null;
  for (const k of d.kalemler||[]){
    const words = norm(k.urun).split(" ").filter(Boolean);
    let p = (k.no!=null && pl[k.no]) || null;
    if (p && !words.some(w=>norm(p.name).includes(w))) p = null;   // model yanlış numara verdiyse güvenme
    if (!p){ const L = posSearch(k.urun); if (L.length===1) p = L[0]; }
    if (!p){ miss.push(k.urun); continue; }
    let q = Number(k.adet) || 1; if (k.birim==="gram") q = q/1000;
    q = r3(q); if (!(q > 0)) continue;
    if (k.birim!=="adet" && !p.byWeight) warn.push(`${p.name} kiloyla satılmıyor; ${fmt(q,3)} adet eklendi`);
    cartAdd(p, q); added.push(`${fmt(q,3)} ${p.name}`);
  }
  const sw = S.posWarn; S.posWarn = null;
  if (d.musteri){
    const n = norm(d.musteri), L = Object.values(S.customers).filter(c=>c.name && c.name.length>1 && (norm(c.name).includes(n) || n.includes(norm(c.name))));
    if (L.length===1){ S.pos.cust = L[0].id; warn.push(`Müşteri: ${L[0].name}`); }
    else warn.push(L.length>1 ? `"${d.musteri}" için birden çok müşteri var, sen seç` : `"${d.musteri}" adlı müşteri bulunamadı`);
  }
  if (d.odeme==="veresiye" && !S.pos.cust) S.posPick = true;
  S.voice = null; S.posQ = ""; cartSave();
  if (!added.length){ S.posErr = `Söylediğin ürünü bulamadım${miss.length ? ": " + miss.join(", ") : ""}. Barkod okutarak ya da adını yazarak ekle.`; render(); return; }
  S.posWarn = [`Sepete eklendi: ${added.join(", ")}.`, miss.length ? `Bulunamadı: ${miss.join(", ")}.` : "", warn.join(". ") + (warn.length ? "." : ""), sw || "",
    d.odeme ? `Söylediğin ödeme: ${PAY[d.odeme]}.` : "", "Kontrol edip ödeme düğmesine bas."].filter(Boolean).join(" ");
  render(); posFocus();
  const w = S.posWarn; clearTimeout(voiceApplySale.t);
  voiceApplySale.t = setTimeout(()=>{ if (S.posWarn===w){ S.posWarn = null; if (S.tab==="satis") render(true); } }, (miss.length || warn.length || sw) ? 15000 : 7000);
}

// Asistan cevabındaki **kalın**, liste (- / * / 1.) ve satır sonlarını düzgün göster (önce kaçış, sonra biçim)
function mdLite(t){
  const lines = String(t||"").replace(/\r/g,"").split("\n"), out = []; let list = null;
  const inl = x => esc(x).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<i>$2</i>").replace(/`([^`]+)`/g, "<code>$1</code>");
  const close = () => { if (list){ out.push(`</${list}>`); list = null; } };
  for (const raw of lines){ const l = raw.trimEnd(); let m;
    if ((m = l.match(/^\s*[-*•]\s+(.*)$/))){ if (list!=="ul"){ close(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inl(m[1])}</li>`); continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))){ if (list!=="ol"){ close(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inl(m[1])}</li>`); continue; }
    close();
    if ((m = l.match(/^#{1,4}\s+(.*)$/))){ out.push(`<b>${inl(m[1])}</b><br>`); continue; }
    out.push(l ? inl(l) + "<br>" : "<br>"); }
  close();
  return out.join("").replace(/(<br>)+$/,"");
}
async function askRun(q){
  const A = askState(); q = String(q||"").trim(); if (q.length < 2 || A.busy) return;
  if (S.mode!=="cloud" || !S.cloud?.shop){ A.err = "Bunun için hesabınla giriş yapman gerekir."; render(true); return; }
  A.pending = [];

  A.busy = true; A.err = ""; A.msgs.push({r:"u", t:q}); A.contents.push({role:"user", parts:[{text:q}]}); render(true); askScroll();
  const t0 = Date.now(), tick = setInterval(()=>{ const e = document.getElementById("ask-sec"); if (e) e.textContent = Math.round((Date.now()-t0)/1000) + " sn"; else if (!askState().busy) clearInterval(tick); }, 1000);
  try{

      const {data, error} = await SB.functions.invoke("asistan", {body:{shop_id:S.cloud.shop.id, mode:"ask", contents:A.contents}});
      if (error){ let e = ""; try{ e = (await error.context?.json?.())?.error || ""; }catch(_){} throw new Error(e || "Olmadı. İnternetini kontrol et."); }
      if (data?.kind==="tool" && Array.isArray(data.calls) && data.content){

        A.contents.push(data.content);
        A.contents.push({role:"user", parts:data.calls.map(c=>({functionResponse:{name:c.name, response:{sonuc:askTool(c.name, c.args)}}}))});
      } else if (data?.kind==="text" && data.text){

      } else throw new Error("Cevap alınamadı. Tekrar dene.");
    }
    if (!done) throw new Error("Çok adım gerekti, soruyu daha basit sor.");
  }catch(e){ A.err = String(e.message||e); A.contents = []; }
  clearInterval(tick); A.busy = false; render(true); askScroll();
}

async function askApply(){

          salePrice:d.satis, salePriceAt:nowIso(), buyPrice:d.alis, barcodes: d.barkod ? [{c:d.barkod, q:1}] : [], byWeight: !!d.kilo});
        done.push(`Yeni ürün eklendi: ${d.ad} (satış ${TLx(d.satis)})`); continue; }

function posScan(raw){
  const txt = String(raw||"").trim(); if (!txt) return;
  S.posErr = null; S.posWarn = null; S.posUnknown = null;
  // "3*barkod" ya da "3x barkod": adetli okutma
  let mult = 1, code = txt; const mm = txt.match(/^(\d+(?:[.,]\d+)?)\s*[*xX×]\s*(.+)$/);
  if (mm){ mult = pnum(mm[1]) || 1; code = mm[2].trim(); }
  const c = cleanCode(code);
  if (/^\d{4,}$/.test(c)){
    const hit = findByBarcode(c);
    if (hit){ cartAdd(hit.p, mult * hit.q); S.posQ = ""; return; }
    const sc = scaleParse(c);
    if (sc && !sc.unknown){ cartAdd(sc.p, sc.q * mult, sc.u, {w:true}); S.posQ = ""; return; }
    S.posUnknown = {code: c, plu: sc?.plu || null}; S.posQ = ""; return;
  }
  const L = posSearch(code);
  if (L.length===1){ addFromSearch(L[0], mult); S.posQ = ""; return; }
  S.posQ = code;
}
function addFromSearch(p, mult){ if (p.byWeight){ S.posWeigh = p.id; return; } cartAdd(p, mult||1); }
function posSearch(q){
  const n = norm(q); if (!n) return [];
  const words = n.split(" ");
  return S.products.filter(p=>{ const h = norm(p.name + " " + (p.aliases||[]).join(" ")); return words.every(w=>h.includes(w)); })
    .sort((a,b)=>a.name.localeCompare(b.name,"tr")).slice(0, 8);
}
function posResults(q){
  const L = posSearch(q);
  if (!q) return "";
  return `<div class="posres">${L.map(p=>`<button data-act="posPick" data-id="${p.id}"><span>${esc(p.name)}${p.byWeight?` <span class="pill">kg</span>`:""}</span><b class="num">${p.salePrice>0?TLx(p.salePrice):"fiyat yok"}</b></button>`).join("") || `<p class="small muted" style="padding:8px">"${esc(q)}" bulunamadı.</p>`}</div>`;
}

function dayRange(t0){ return [t0, t0 + DAY]; }
function kasaDay(t0){
  const [a, b] = dayRange(t0), inDay = x => { const t = tOf(x); return t >= a && t < b; };
  const sales = S.sales.filter(s=>!s.x && inDay(s));
  const sum = (arr, f) => r2(arr.reduce((acc,x)=>acc + f(x), 0));
  const cash = S.cash.filter(inDay).sort((x,y)=>x.d.localeCompare(y.d));
  const acil = cash.filter(x=>x.t==="acilis").pop();
  const kap = cash.filter(x=>x.t==="kapanis").pop();
  const tahsil = S.events.filter(e=>e.type==="odeme" && (t=>t>=a&&t<b)(Date.parse(e.date)));
  const r = {
    acilis: acil ? Number(acil.a)||0 : 0, acilisSet: !!acil,
    nakit: sum(sales.filter(s=>(s.pay||"nakit")==="nakit"), s=>s.tot), kart: sum(sales.filter(s=>s.pay==="kart"), s=>s.tot),
    veresiye: sum(sales.filter(s=>s.pay==="veresiye"), s=>s.tot), tahsilat: sum(tahsil, e=>Number(e.amount)||0),
    giris: sum(cash.filter(x=>x.t==="giris"), x=>x.a), cikis: sum(cash.filter(x=>x.t==="cikis"), x=>x.a),
    fis: sales.filter(s=>!s.r).length, iade: sum(sales.filter(s=>s.r), s=>s.tot), ciro: sum(sales, s=>s.tot), cash, kap, sales };
  r.beklenen = r2(r.acilis + r.nakit + r.tahsilat + r.giris - r.cikis);
  if (kap){   // gün kapandıysa: kasa sayılan (ya da yarına bırakılan) paradan devam eder, sadece kapanıştan sonrakiler eklenir
    const kt = tOf(kap), af = x => tOf(x) > kt;
    const base = kap.birak!=null ? Number(kap.birak)||0 : Number(kap.say ?? kap.a)||0;
    r.afterKap = {base, nakit: sum(sales.filter(s=>(s.pay||"nakit")==="nakit" && af(s)), s=>s.tot), tahsilat: sum(tahsil.filter(e=>Date.parse(e.date) > kt), e=>Number(e.amount)||0),
      giris: sum(cash.filter(x=>x.t==="giris" && af(x)), x=>x.a), cikis: sum(cash.filter(x=>x.t==="cikis" && af(x)), x=>x.a), birak: kap.birak!=null};
    const A = r.afterKap; r.beklenen = r2(A.base + A.nakit + A.tahsilat + A.giris - A.cikis);
  }
  return r;
}

  const tot = r2(it.reduce((a,x)=>a + x.q*x.u, 0)), given = pnum(S.posGiven);
  // Alınan para tutardan azsa nakit satış kapanmaz: parayı düzelt ya da kalanı veresiyeye yaz
  if (pay==="nakit" && !ret && given > 0 && given < tot - 0.005){ S.posShort = true; S.posErr = null; render(); setTimeout(()=>document.getElementById("pos-short")?.scrollIntoView({block:"center"}),0); return; }
  if (split && !(given > 0 && given < tot - 0.005)){ S.posShort = false; render(); return; }
  const sale = {id: newId(), d: nowIso(), it, tot, pay, ...(cust ? {c: cust} : {}), ...(ret ? {r: true} : {}), ...(pay==="nakit" && given > 0 && !ret ? {al: r2(given)} : {})};
  try{
    await posMarkStart();
    if (pay==="veresiye"){ sale.ev = newId();
      await store.addEvent({id: sale.ev, type:"borc", productId:"-", customerId: cust, amount: tot, date: sale.d, saleId: sale.id,
        note: (ret ? "İade: " : "Satış: ") + it.map(x=>x.n + (Math.abs(x.q)!==1 ? " ×" + fmt(Math.abs(x.q),3) : "")).slice(0,4).join(", ") + (it.length>4 ? " …" : "")}); }
    if (split){ sale.pe = newId(); await store.addEvent({id: sale.pe, type:"odeme", productId:"-", customerId: cust, amount: r2(given), date: sale.d, saleId: sale.id, note:"Satışta peşin alınan"}); }
    await store.saveSale(sale);
  }catch(e){ S.posErr = "Kaydedilemedi: " + (e?.message||e); render(); return; }
  S.posShort = false;
  S.pos = {items:[], cust:null, ret:false}; cartSave();
  S.posLast = sale; S.posGiven = ""; S.posErr = null; S.posOver = null; S.posWarn = null; S.posPick = false; S.posClear = false; S.posUnknown = null;
  offerUndo(split ? `Satış kaydedildi: ${TLx(given)} peşin, ${TLx(r2(tot-given))} veresiye.` : `${ret?"İade":"Satış"} kaydedildi: ${TLx(tot)} ${PAY[pay].toLocaleLowerCase("tr")}.`, ()=>posCancel(sale.id, true));
  setTimeout(()=>{ try{ nAfterSale(sale); }catch(_){} }, 300);
  render(); posFocus();
}
async function posCancel(id, undo){
  const s = S.sales.find(x=>x.id===id); if (!s || s.x) return;
  await store.saveSale({...s, x: true, xAt: nowIso()});
  if (s.ev && S.events.some(e=>e.id===s.ev)) await store.deleteEvent(s.ev);
  if (s.pe && S.events.some(e=>e.id===s.pe)) await store.deleteEvent(s.pe);
  if (undo && S.posLast?.id===id) S.posLast = null;
  S.msg = {kind:"ok", text:`${hhmm(tOf(s))} satışı iptal edildi; stok ve kasa düzeltildi.`};
  render();
}

async function kasaSave(f){
  const a = pnum(document.getElementById("kf-a")?.value), r = document.getElementById("kf-r")?.value || "", n = (document.getElementById("kf-n")?.value||"").trim();
  const b = pnum(document.getElementById("kf-b")?.value), supSel = f==="cikis" ? (document.getElementById("kf-sup")?.value || "") : "";

  if (!(a >= 0) || (f!=="kapanis" && !(a > 0))){ S.kasaErr = (a<0?"Tutar eksi olamaz.":"Tutarı yaz."); render(true); return; }
  if ((f==="cikis"||f==="giris") && !r && !supSel){ S.kasaErr = "Sebebini seç."; render(true); return; }
  if ((f==="cikis"||f==="giris") && r==="Diğer" && !n){ S.kasaErr = "\"Diğer\" seçtiysen açıklamaya ne olduğunu yaz."; render(true); setTimeout(()=>{ const d = document.querySelector(".knote"); if (d) d.open = true; document.getElementById("kf-n")?.focus(); }, 0); return; }

  if (f==="cikis"){ const kb = r2(kasaDay(today0()).beklenen);
    if (r2(a) > Math.max(0, kb) + 0.005 && S.kasaOver!==r2(a)){ S.kasaOver = r2(a); S.kasaErr = `Kasada ${TLx(Math.max(0, kb))} var, sen ${TLx(a)} yazdın. Doğruysa tekrar Kaydet'e bas.`; render(true); return; } }
  if (f==="kapanis"){ const kp = kasaDay(today0()).cash.filter(c=>c.t==="kapanis");
    if (kp.length && !S.kapOk){ S.kapOk = true; S.kasaErr = `Bugün saat ${hhmm(tOf(kp[kp.length-1]))}'de zaten kapattın. Yeniden kapatmak için tekrar Kaydet'e bas.`; render(true); return; } }

function tanScan(raw){

  const hit = findByBarcode(c);

/* ---------- Stok hareketleri: kim, ne zaman, kaçtan kaça ---------- */
const HR_TYPES = ["sayim","gelen","iade","fire","ariza"];
function hareketRows(){
  const prev = {}, out = [];
  const evs = S.events.filter(e=>HR_TYPES.includes(e.type) && e.productId && e.productId!=="-").slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  for (const e of evs){
    const p = S.products.find(x=>x.id===e.productId), q = Number(e.qty)||0;
    let from = null, to = null, diff = null;
    if (e.type==="sayim"){ from = e.was!=null ? Number(e.was) : (prev[e.productId]!=null ? prev[e.productId] : null); to = q; diff = from!=null ? r2(to-from) : null; prev[e.productId] = q; }
    else diff = e.type==="gelen" ? q : -q;
    const who = (S.mode==="cloud" && C.by) ? (whoName(C.by["event:"+e.id]) || "") : "";
    out.push({e, name: p ? p.name : "(silinmiş ürün)", unit: p ? unitOf(p) : "", from, to, diff, who});
  }
  return out.reverse();
}
function hareketLabel(r){
  const n = v => v==null ? "?" : fmt(v, v<10 && v%1 ? 1 : 0), sg = v => (v>0?"+":v<0?"−":"") + n(Math.abs(v));
  if (r.e.type==="sayim") return r.from!=null ? `${n(r.from)} → ${n(r.to)}` : `Sayım: ${n(r.to)}`;
  return sg(r.diff);
}
function viewHareket(){
  const f = S.hrF || "all";
  let rows = hareketRows();
  if (f==="sayim") rows = rows.filter(r=>r.e.type==="sayim");

/* ---------- Satış raporları: günlük / haftalık / aylık / yıllık + Excel ---------- */
const RG = {day:"Günlük", week:"Haftalık", month:"Aylık", year:"Yıllık"};
const RP_PRE = [["bugun","Bugün","day"],["hafta","Bu Hafta","day"],["buay","Bu Ay","day"],["gecenay","Geçen Ay","day"],["buyil","Bu Yıl","month"],["12ay","Son 12 Ay","month"],["yillar","Son 3 Yıl","year"]];
const monday = t => { const d = new Date(t); d.setHours(0,0,0,0); const w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); return d; };
function rpPreset(k){
  const t = new Date(today0()), Y = t.getFullYear(), M = t.getMonth(); let a = t, b = t;
  if (k==="hafta") a = monday(t);
  else if (k==="buay") a = new Date(Y, M, 1);
  else if (k==="gecenay"){ a = new Date(Y, M-1, 1); b = new Date(Y, M, 0); }
  else if (k==="buyil") a = new Date(Y, 0, 1);
  else if (k==="12ay") a = new Date(Y, M-11, 1);
  else if (k==="yillar") a = new Date(Y-2, 0, 1);
  return {from: ymd(a.getTime()), to: ymd(b.getTime())};
}
function rpState(){ if (!S.rp){ const r = rpPreset("hafta"); S.rp = {g:"day", from:r.from, to:r.to, pre:"hafta"}; } return S.rp; }
const ymdLocalT = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, (m||1)-1, d||1).getTime(); };
function rpKey(t, g){ const d = new Date(t);
  if (g==="week") return ymd(monday(t).getTime());
  if (g==="month") return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-01";
  if (g==="year") return d.getFullYear() + "-01-01";
  return ymd(t); }
function rpLabel(k, g){ const t = ymdLocalT(k), d = new Date(t);
  if (g==="week"){ const e = new Date(t + 6*DAY); return `${d.toLocaleDateString("tr-TR",{day:"numeric",month:"short"})} – ${e.toLocaleDateString("tr-TR",{day:"numeric",month:"short",year:"numeric"})}`; }
  if (g==="month") return d.toLocaleDateString("tr-TR",{month:"long",year:"numeric"});
  if (g==="year") return String(d.getFullYear());
  return d.toLocaleDateString("tr-TR",{day:"numeric",month:"short",year:"numeric",weekday:"short"}); }
// Telefondaki kayıtlarla rapor (internet yokken ya da bulut dışı kullanımda)
function reportLocal(fromT, toT, g){
  const inR = t => t >= fromT && t < toT;
  const sales = S.sales.filter(s=>!s.x && inR(tOf(s))), cash = S.cash.filter(x=>inR(tOf(x))).sort((a,b)=>a.d.localeCompare(b.d));
  const odeme = S.events.filter(e=>e.type==="odeme" && inR(Date.parse(e.date)));
  const per = {}, P = k => (per[k] ||= {k, fis:0, ciro:0, iade:0, nakit:0, kart:0, veresiye:0, maliyet:0, ciro_bilinen:0, tahsilat:0, giris:0, cikis:0});
  const prod = {};
  for (const s of sales){ const x = P(rpKey(tOf(s), g)), tot = Number(s.tot)||0;
    if (!s.r) x.fis++; else x.iade += tot; x.ciro += tot; x[(s.pay||"nakit")] += tot;
    for (const it of (s.it||[])){ const q = Number(it.q)||0, u = Number(it.u)||0, b = it.b==null ? null : Number(it.b);
      if (b!=null){ x.maliyet += q*b; x.ciro_bilinen += q*u; }
      const pr = (prod[it.p] ||= {p:it.p, n:it.n, q:0, ciro:0, maliyet:0, eksik:false}); pr.n = it.n; pr.q += q; pr.ciro += q*u; if (b!=null) pr.maliyet += q*b; else pr.eksik = true; } }
  for (const e of odeme) P(rpKey(Date.parse(e.date), g)).tahsilat += Number(e.amount)||0;
  for (const c of cash) if (c.t==="giris"||c.t==="cikis") P(rpKey(tOf(c), g))[c.t] += Number(c.a)||0;
  const reasons = {}; for (const c of cash) if (c.t==="giris"||c.t==="cikis"){ const k = c.t + "|" + (c.r||"Diğer"); const r = (reasons[k] ||= {t:c.t, r:c.r||"Diğer", a:0, adet:0}); r.a += Number(c.a)||0; r.adet++; }

/* ---------- Aşağı çekip yenile ---------- */
(function(){
  const TH = 70; let y0 = null, d = 0, el = null, busy = false;
  function box(){ if (!el){ el = document.createElement("div"); el.id = "ptr"; el.setAttribute("aria-hidden","true");
      el.innerHTML = '<span class="ptr-i">↓</span><span class="ptr-t">Yenilemek için çek</span>'; document.body.appendChild(el); } return el; }
  function hide(){ if (el && !busy){ el.style.transform = "translate(-50%,-70px)"; el.style.opacity = "0"; } }
  const blocked = t => !!(t && t.closest && t.closest("input,textarea,select,.custlist,.tscroll,.posres,.pinpad,dialog"));
  document.addEventListener("touchstart", e=>{
    if (busy || e.touches.length!==1 || (document.scrollingElement||document.documentElement).scrollTop > 0 || blocked(e.target)){ y0 = null; return; }
    y0 = e.touches[0].clientY; d = 0;
  }, {passive:true});
  document.addEventListener("touchmove", e=>{
    if (y0==null) return;
    d = (e.touches[0].clientY - y0) * 0.5;
    if (d <= 0 || (document.scrollingElement||document.documentElement).scrollTop > 0){ hide(); return; }
    const x = box(), k = Math.min(d, 110);
    x.style.transition = "none"; x.style.transform = `translate(-50%,${k-50}px)`; x.style.opacity = String(Math.min(1, k/50));
    x.classList.toggle("go", d >= TH); x.querySelector(".ptr-t").textContent = d >= TH ? "Bırak, yenilensin" : "Yenilemek için çek";
  }, {passive:true});
  document.addEventListener("touchend", ()=>{
    if (y0==null) return; y0 = null;
    if (el) el.style.transition = "";
    if (d < TH){ hide(); return; }
    busy = true; const x = box(); x.classList.add("go"); x.querySelector(".ptr-i").innerHTML = '<span class="spin"></span>'; x.querySelector(".ptr-t").textContent = "Yenileniyor";
    x.style.transform = "translate(-50%,14px)"; x.style.opacity = "1";
    try{ if (typeof cloudSaveNow==="function" && CLOUD_ON) cloudSaveNow(); }catch(_){}
    setTimeout(()=>location.reload(), 250);
  }, {passive:true});
  document.addEventListener("touchcancel", ()=>{ y0 = null; hide(); }, {passive:true});
})();


/* ---------- Alt menü: görünen ekranın dibine yapışsın ---------- */
(function(){
  const vv = window.visualViewport;
  const typing = t => !!(t && t.matches && t.matches("input:not([type=checkbox]):not([type=radio]):not([type=button]):not([type=submit]):not([type=file]),textarea,select"));
  let raf = 0;
  function fix(){
    raf = 0; const n = document.querySelector("nav.tabs"); if (!n || !vv) return;
    // Ekran klavyesi açık: görünen alan belirgin küçülür -> menüyü gizle (alan açılsın, klavyenin üstünde uçmasın)
    const kb = typing(document.activeElement) && vv.height < window.innerHeight * 0.8;
    document.body.classList.toggle("kb", kb);
    // iOS klavye kapandıktan sonra sabit öğeleri eski yerde bırakabiliyor: menüyü görünen alanın dibine taşı
    const off = Math.round(vv.offsetTop + vv.height - window.innerHeight);

    n.style.transform = (!kb && off > 1 && sy >= 0 && vv.offsetTop >= 0 && !document.getElementById("ptr")?.classList.contains("go")) ? "translateY(" + off + "px)" : "";
  }
  const later = () => { if (!raf) raf = requestAnimationFrame(fix); };
  window.navFix = fix;
  if (vv){ vv.addEventListener("resize", later); vv.addEventListener("scroll", later); }
  window.addEventListener("scroll", later, {passive:true});
  window.addEventListener("orientationchange", () => setTimeout(fix, 350));
  document.addEventListener("focusin", later);
  document.addEventListener("focusout", () => { setTimeout(fix, 80); setTimeout(fix, 400); });
})();

document.addEventListener("submit", async ev=>{
  if (ev.target.id!=="pmform") return; ev.preventDefault(); if (!SB || !C.shop) return;
  const kind = ev.target.dataset.pm, a = document.getElementById("pm-a")?.value || "", b = document.getElementById("pm-b")?.value || "";
  try{
    if (kind==="setup"){
      if (a.length < 6) { S.pm = {st:"setup", err:"En az 6 karakter yaz."}; return render(true); }
      if (a !== b){ S.pm = {st:"setup", err:"İki parola aynı değil."}; return render(true); }
      const {data, error} = await SB.rpc("perm_pin_set", {p_shop:C.shop.id, p_new:a});
      if (error) S.pm = {st:"setup", err:String(error.message||"Kaydedilemedi.")};
      else S.pm = {st:"open", t:Date.now()};
    } else if (kind==="lock"){
      const {data, error} = await SB.rpc("perm_pin_check", {p_shop:C.shop.id, p_pin:a});
      if (error) S.pm = {st:"lock", err:"Şu an kontrol edilemedi."};
      else if (data.ok) S.pm = {st:"open", t:Date.now()};
      else { if (data.notify) permNotify();
        S.pm = {st:"lock", err: data.reason==="wrong" ? "Yanlış parola. " + data.left + " hakkın kaldı." : permWait(data.wait)}; }
    } else if (kind==="change"){
      if (b.length < 6) { S.pm = {st:"change", err:"Yeni parola en az 6 karakter olmalı."}; return render(true); }
      const {data, error} = await SB.rpc("perm_pin_set", {p_shop:C.shop.id, p_new:b, p_old:a});
      if (error) S.pm = {st:"change", err:String(error.message||"Değiştirilemedi.")};
      else if (data.ok){ S.pm = {st:"open", t:Date.now()}; S.msg = {kind:"ok", text:"Yetki parolası değişti."}; }
      else { if (data.notify) permNotify(); S.pm = {st:"change", err: data.reason==="wrong" ? "Eski parola yanlış." : permWait(300)}; }
    }
  }catch(e){ S.pm = {st:"lock", err:"İşlem yapılamadı. Tekrar dene."}; }
  render(true);
});

/* ---------- Tedarikçiler: veresiyenin tersi — kime ne kadar borcum var ---------- */
const isSupLedger = e => e.type==="tborc" || e.type==="todeme";
const SUP_VADE = 15;
function supList(){
  const m = {};
  for (const s of Object.values(S.suppliers||{})) if (s && s.name) m[s.id] = s;
  for (const p of S.products) if (p.supplier){ const k = supKey(p.supplier); if (!m[k]) m[k] = {id:k, name:p.supplier, days:[]}; }
  for (const e of S.events) if (isSupLedger(e) && e.supplierId && !m[e.supplierId]) m[e.supplierId] = {id:e.supplierId, name:e.supName||e.supplierId, days:[]};
  return Object.values(m).sort((a,b)=>String(a.name).localeCompare(String(b.name),"tr"));
}
const supName = id => (S.suppliers[id]?.name) || (S.events.find(e=>e.supplierId===id && e.supName)?.supName) || (S.products.find(p=>p.supplier && supKey(p.supplier)===id)?.supplier) || "Tedarikçi";
function supStats(id){
  const ev = S.events.filter(e=>isSupLedger(e) && e.supplierId===id).sort((a,b)=>a.date.localeCompare(b.date));
  let bal = 0, bought = 0, paid = 0, lastT = 0, lastPay = 0; const debts = [];
  for (const e of ev){ const a = Number(e.amount)||0, t = new Date(e.date).getTime();
    if (e.type==="tborc"){ bal += a; bought += a; debts.push({t, left:a}); }
    else { bal -= a; paid += a; lastPay = t; let pay = a; for (const d of debts){ if (pay<=0) break; const k = Math.min(d.left, pay); d.left -= k; pay -= k; } }
    lastT = t; }
  const open = debts.filter(d=>d.left>0.005), oldest = open.length ? open[0].t : null, ageDays = oldest ? (Date.now()-oldest)/DAY : 0;
  const vade = Number(S.suppliers[id]?.vade) || SUP_VADE;
  return {bal: r2(bal), ev, bought: r2(bought), paid: r2(paid), oldest, ageDays, vade, due: bal > 0.005 && ageDays >= vade, lastT, lastPay};
}
function supDue(){ return supList().map(s=>({s, st:supStats(s.id)})).filter(x=>x.st.due).sort((a,b)=>b.st.ageDays-a.st.ageDays); }
async function supEnsure(name){
  const nm = String(name||"").trim(); if (!nm) return null;
  const k = supKey(nm); if (!S.suppliers[k]) await store.saveSupplier({id:k, name:nm, days:[], lead:0}); return k;
}
const supCashReason = name => /ekmek|fırın|firin/i.test(name||"") ? "Ekmekçi" : "Toptancı / plasiyer ödemesi";
async function supRecord({supId, amount, kind, note, invKey, fromCash, date}){
  const d = date || nowIso(), eid = newId(), nm = supName(supId);
  const ev = {id:eid, type: kind==="odeme" ? "todeme" : "tborc", productId:"-", supplierId:supId, supName:nm, amount:r2(amount), note:note||null, date:d, ...(invKey ? {invKey} : {})};
  if (kind==="odeme" && fromCash){
    const cid = newId(); ev.cashId = cid;
    await store.addEvent(ev);
    await posMarkStart();
    await store.saveCash({id:cid, d, t:"cikis", a:r2(amount), r:supCashReason(nm), n:nm + (note ? " · " + note : ""), sup:supId, ev:eid});
    try{ nAfterCash({id:cid, t:"cikis", a:r2(amount), r:supCashReason(nm), n:nm}); }catch(_){}
  } else await store.addEvent(ev);
  return eid;
}
async function supReceive({supName:nm, lines, pay, note}){
  const k = await supEnsure(nm); if (!k) throw new Error("Kimden aldığını yaz.");
  const date = nowIso(), invKey = newId(); let tot = 0, n = 0;
  await posMarkStart();
  for (const l of lines){ const p0 = S.products.find(x=>x.id===l.p); if (!p0 || !(l.qty > 0)) continue;
    const price = l.price > 0 ? r2(l.price) : null;
    await store.addEvent({id:newId(), type:"gelen", productId:p0.id, qty:l.qty, price, invoiceNo:null, supplier:supName(k), date, invKey});
    const upd = {}; if (price && Number(p0.buyPrice)!==price) upd.buyPrice = price; if (!p0.supplier) upd.supplier = supName(k); if (p0.outSince) upd.outSince = null;
    if (Object.keys(upd).length) await store.saveProduct({...S.products.find(x=>x.id===p0.id), ...upd});
    if (price) tot += l.qty * price; n++; }
  tot = r2(tot);
  if (tot > 0){ await supRecord({supId:k, amount:tot, kind:"borc", note: note || "Mal alımı", invKey, date});
    if (pay==="kasa" || pay==="disari") await supRecord({supId:k, amount:tot, kind:"odeme", note:"Peşin ödendi", invKey, fromCash: pay==="kasa", date}); }
  return {k, tot, n, invKey};
}
async function supDeleteEntry(id){
  const e = S.events.find(x=>x.id===id); if (!e) return;
  if (e.invKey && S.events.some(x=>x.type==="gelen" && x.invKey===e.invKey)){ await deleteInvoice(e.invKey); return; }
  if (e.cashId){ const c = S.cash.find(x=>x.id===e.cashId); if (c) await store.deleteCash(c.id); }
  await store.deleteEvent(id);
}

/* ===== Ürün yardımcıları (iki uygulamada ortak): − / + düğmesi, aynı isimli ürüne ekleme, çift ürünleri birleştirme ===== */
function pCur(p){ const s = stockStatus(p, stats(p)); return s.cur.known ? Number(s.cur.v)||0 : null; }
const pQtyTxt = v => v==null ? "?" : fmt(v, v<10 && v%1 ? 1 : 0);
function pTwin(name, exceptId){ const n = norm(String(name||"").trim()); if (!n) return null; return stockP().find(x=>x.id!==exceptId && norm(x.name)===n) || null; }
// − / + : ekranda hemen değişir, 1 sn dokunulmazsa tek sayım olarak kaydedilir
S.pPend = S.pPend || {};
function pStepper(p, cls){
  const v = S.pPend[p.id] ?? pCur(p);
  return `<span class="pstep ${cls||""}"><button type="button" data-act="pStep" data-id="${p.id}" data-d="-1" aria-label="${esc(p.name)} bir azalt" ${v===0?"disabled":""}>${ic("minus",22)}</button><b class="num" data-pq="${p.id}">${pQtyTxt(v)}</b><button type="button" data-act="pStep" data-id="${p.id}" data-d="1" aria-label="${esc(p.name)} bir artır">${ic("plus",22)}</button></span>`;
}
function pStep(id, d){
  if (d < 0 && isStaff() && !can("azalt")){ S.msg = {kind:"bad", text:"Stoğu azaltmayı sadece dükkân sahibi yapar. Rafta daha az varsa ona haber ver."}; render(true); return; }
  const p = S.products.find(x=>x.id===id); if (!p) return;
  const base = S.pPend[id] ?? pCur(p) ?? 0, v = Math.max(0, r2(base + d));
  S.pPend[id] = v;
  document.querySelectorAll(`[data-pq="${id}"]`).forEach(el=>{ el.textContent = pQtyTxt(v); el.classList.add("pend"); const m = el.parentElement.querySelector('[data-d="-1"]'); if (m) m.disabled = v===0; });
  clearTimeout(pStep.t[id]); pStep.t[id] = setTimeout(()=>pCommit(id), 1000);
}
pStep.t = {};
async function pCommit(id){
  const v = S.pPend[id]; if (v==null) return; const p = S.products.find(x=>x.id===id);
  const before = p ? pCur(p) : null;
  if (p && v !== before) await addCount(p, v);
  delete S.pPend[id];
  document.querySelectorAll(`[data-pq="${id}"]`).forEach(el=>el.classList.remove("pend"));
  // − / + ayrı bir Kaydet düğmesi istemez: 1 sn sonra kendiliğinden kaydedilir; kullanıcı kaydedildiğini görsün, yanlışsa geri alsın
  if (p && v !== before) offerUndo(`Kaydedildi: ${p.name} ${pQtyTxt(before)} → ${pQtyTxt(v)} ${unitOf(p)}`, async ()=>{ const q = S.products.find(x=>x.id===id); if (q && before!=null) await addCount(q, before); render(true); });
}

async function pAddTo(id, qty, o){
  const p = S.products.find(x=>x.id===id); if (!p) return null;
  if (fracBad(p, qty)) return `${p.name}: ${FRAC_MSG}`;
  o = o || {}; const before = pCur(p), add = qty > 0 ? qty : 0;
  const codes = (o.codes||[]).filter(c=>!(p.barcodes||[]).some(b=>b.c===c) && !barcodeOwner(c, p.id));
  const sale = o.sale > 0 ? r2(o.sale) : null, buy = o.buy > 0 ? r2(o.buy) : null;
  if (codes.length || sale || buy) await store.saveProduct({...p, barcodes:(p.barcodes||[]).concat(codes.map(c=>({c, q:1}))),
    ...(sale ? {salePrice:sale, salePriceAt: Number(p.salePrice)===sale ? (p.salePriceAt||null) : nowIso()} : {}), ...(buy ? {buyPrice:buy} : {})});
  if (add) await addCount(S.products.find(x=>x.id===id), r2((before||0) + add));
  const u = unitOf(p);
  return add ? (before==null ? `${p.name}: rafta ${pQtyTxt(add)} ${u} oldu.` : `${p.name}: ${pQtyTxt(before)} + ${pQtyTxt(add)} = ${pQtyTxt(r2(before+add))} ${u} oldu.`) : `${p.name} güncellendi.`;

async function pMerge(ids){
  const g = ids.map(id=>S.products.find(x=>x.id===id)).filter(Boolean); if (g.length<2) return;
  // en çok bilgisi olanı (barkod, fiyat) bırak
  const score = p => (p.barcodes||[]).length*2 + (p.salePrice>0?1:0) + (p.buyPrice>0?1:0);
  g.sort((a,b)=>score(b)-score(a) || String(a.createdAt||"").localeCompare(String(b.createdAt||"")));
  const keep = g[0], rest = g.slice(1);
  const known = g.map(pCur), tot = r2(known.reduce((a,v)=>a+(v||0),0)), anyKnown = known.some(v=>v!=null);
  const bc = [...(keep.barcodes||[])]; for (const p of rest) for (const b of (p.barcodes||[])) if (!bc.some(x=>x.c===b.c)) bc.push(b);
  const pick = k => keep[k] ?? rest.map(p=>p[k]).find(v=>v!=null && v!=="");
  await store.saveProduct({...keep, barcodes:bc, salePrice:pick("salePrice") ?? null, buyPrice:pick("buyPrice") ?? null, supplier: keep.supplier || pick("supplier") || ""});
  for (const p of rest) await store.deleteProduct(p.id);
  if (anyKnown) await addCount(S.products.find(x=>x.id===keep.id), tot);
  return `${keep.name} birleştirildi${anyKnown ? `: rafta ${pQtyTxt(tot)} ${unitOf(keep)}` : ""}.`;
}

var H_STACK = [], H_I = -1, H_POP = false, H_SKIP = false, H_USER = 0;
["pointerdown","keydown"].forEach(e=>document.addEventListener(e, ()=>{ H_USER = Date.now(); }, true));
// geri tuşunun hatırlayacağı "ekran içi" durumlar: açık form, müşteri/ürün ayrıntısı, Satış alt ekranı, rehber
const H_KEYS = ["posView","kasaForm","vCust","editId","kEdit","supOpen","supForm","supEdit","guide"];
function hSnap(){ const v = {}; for (const k of H_KEYS){ const x = S[k]; if (x!=null && x!==false && x!=="" && !(k==="posView" && x==="sat")) v[k] = x; } return {bdTab:S.tab, v}; }
function histSync(){
  if (S.locked) return;
  const st = hSnap(), sig = JSON.stringify(st);
  if (H_POP){ H_POP = false; if (H_I>=0) H_STACK[H_I] = sig; return; }
  if (H_I>=0 && sig===H_STACK[H_I]) return;
  const user = Date.now() - H_USER <= 1500;
  try{
    if (H_I<0 || !user){ H_I = Math.max(H_I,0); st.i = H_I; history.replaceState(st, ""); H_STACK[H_I] = sig; }
    else if (H_I>0 && sig===H_STACK[H_I-1]){ H_SKIP = true; H_I--; history.back(); }   // form/ayrıntı kapandı: bir adım geri git, boş adım bırakma
    else { H_STACK.length = H_I+1; H_I++; st.i = H_I; history.pushState(st, ""); H_STACK[H_I] = sig; }
  }catch(_){}
}

function kStok(){

  for (const r of rows){ if (!r.s.cur.known) continue; const b = r.st.money.buy ?? Number(r.p.buyPrice); if (b>0) val += r.s.cur.v*b; if (Number(r.p.salePrice)>0) valS += r.s.cur.v*Number(r.p.salePrice); }

function kStokList(rows){
  const f = S.kStokF || "all", q = norm(S.kq||"");
  const order = {out:0, low:1, unk:2, over:3, ok:4};
  const list = rows.filter(r=>(f==="all" || (f==="az" && (r.s.k==="low"||r.s.k==="out")) || (f==="bitti" && r.s.k==="out")) && (!q || norm(r.p.name).includes(q)))
    .sort((a,b)=>order[a.s.k]-order[b.s.k] || a.p.name.localeCompare(b.p.name,"tr"));
  if (!list.length) return `<p class="muted">Ürün bulunamadı.</p>`;
  return list.slice(0, 200).map(({p,s})=>{
    const sp = Number(p.salePrice)||null, warn = s.k==="out" || s.k==="low";
    return `<div class="kitem"><button class="kn" data-act="kEdit" data-id="${p.id}"><b>${esc(p.name)}</b><span class="small">${sp?kTL(sp):"Fiyat yok"}${warn ? ` · <span style="color:${s.c};font-weight:700">${s.k==="out"?"Bitti":"Azaldı"}</span>` : ""}</span></button>${pStepper(p)}</div>`;
  }).join("") + (list.length > 200 ? `<p class="small muted">İlk 200 ürün gösteriliyor; aramayı daralt.</p>` : "");
}
function kKar(){

  if (!d) return h + `<p class="muted">${S.rpBusy ? '<span class="spin"></span> Hesaplanıyor' : "Dönem seç."}</p>`;

  h += `<section class="card stack kpl">
    <div class="kline"><span>${ic("coin",20)} Satış</span><b class="num">${kTL(T.ciro)}</b></div>${bar(T.ciro, "var(--c7)")}

    <div class="kline"><span>${ic("receipt",20)} Giderler</span><b class="num ${gider>0.005?"neg":""}">${kNeg(gider)}</b></div>${bar(gider, "var(--c3)")}
    ${gid.length ? `<div class="ksub">${gid.map(r=>`<div class="row between small"><span>${esc(r.r)} · ${r.adet} kez</span><span class="num">${kTL(r.a)}</span></div>`).join("")}</div>` : ""}

  return h;

      perishable:false, core:false, unit: w ? "kg" : "tane", everyN:1, shelfDays:null, initialStock: cnt >= 0 ? cnt : null,
      salePrice:r2(sale), salePriceAt:nowIso(), buyPrice: buy>0 ? r2(buy) : null, barcodes:bcs, byWeight:w});

async function dyAct(a, t){

    if (S.mode!=="cloud" || !S.cloud?.shop){ d.aiErr = "Bunun için hesabınla giriş yapman gerekir."; render(true); return true; }

      const id = data?.job_id; if (!id) throw new Error("Olmadı. Tekrar dene.");

        if (j?.status==="bitti"){ dyBar("bitti"); d.ai = j.result; }

      }

  if (a==="dyTheme"){ d.theme = (d.theme+1) % Duyuru.THEMES.length; dySave(); dyUpd(); return true; }
  if (a==="dyDurum"){ d.durum = t.dataset.v; d.v = 0; render(true); return true; }

  return false;
}

    if (S.kasaErr){ S.kasaErr = null; t.closest("form")?.querySelectorAll(".notice.bad").forEach(n=>n.remove()); }
    const nd = document.querySelector(".knote"); if (nd && S.kReason==="Diğer"){ nd.open = true; nd.querySelector("summary").textContent = "Ne için? (yaz)"; }
    const w = document.getElementById("k-supw"); if (w){ w.hidden = !K_MAL.includes(S.kReason); if (w.hidden) document.getElementById("kf-sup").value = ""; } document.querySelectorAll('[data-act="kReason"]').forEach(b=>b.classList.toggle("on", b===t)); return true; }
  if (a==="settings"){ S.tab = S.tab==="k-daha" ? "k-ana" : "k-daha"; S.msg = null; render(); window.scrollTo(0,0); return true; }
  if (a==="kStokF"){ S.kStokF = t.dataset.f; render(); return true; }
  if (a==="kCount"){ S.kCount = S.kCount===id ? null : id; render(true); setTimeout(()=>document.getElementById("kcnt-"+id)?.focus(),0); return true; }
  if (a==="kEdit" || a==="kTanit"){ S.kEdit = (a==="kEdit" && id) || "__new"; S.kBc = null; S.kBack = null; S.kErr = null; S.msg = null; S.tab = "k-urun"; render(); window.scrollTo(0,0); setTimeout(()=>document.getElementById(S.kEdit==="__new" ? "ku-bc" : "ku-sale")?.focus(),0); return true; }
  if (a==="posTanitThis"){ S.kBc = S.posUnknown?.code || ""; S.posUnknown = null; S.kBack = "satis"; S.kEdit = "__new"; S.kErr = null; S.msg = null; S.tab = "k-urun"; render(); window.scrollTo(0,0); setTimeout(()=>document.getElementById("ku-name")?.focus(),0); return true; }
  if (a==="kStep"){ const el = document.getElementById("ku-cnt"); if (el){ const v = pnum(el.value); el.value = String(Math.max(0, (isNaN(v) ? 0 : v) + Number(t.dataset.d))).replace(".",","); } return true; }
  if (a==="count"){ S.kCount = null; return false; }
  if (a==="kSupOpen"){ S.tab = "tedarik"; S.supOpen = id; S.supForm = null; S.supEdit = null; S.msg = null; render(); window.scrollTo(0,0); return true; }
  if (a==="kDel"){ if (S.kDelC!==id){ S.kDelC = id; render(true); return true; } S.kDelC = null; const old = {...S.products.find(x=>x.id===id)}; await store.deleteProduct(id);
    offerUndo(`${old.name} silindi.`, ()=>store.saveProduct(old)); S.kEdit = null; S.tab = "k-stok"; S.msg = {kind:"ok", text:`${old.name} silindi.`}; render(); window.scrollTo(0,0); return true; }
  return false;
}
